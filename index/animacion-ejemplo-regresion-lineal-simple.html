<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Regresión lineal simple</title>
<style>
  :root{
    --bg:#0a1020;
    --bg2:#101a33;
    --ink:#eef3ff;
    --dim:#7c8aa8;
    --grid:#1b2740;
    --axis:#33415e;
    --pt:#39e0d0;
    --line:#ffb020;
    --err:#ff5c7a;
    --pred:#a78bfa;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(120% 90% at 70% 0%, var(--bg2) 0%, var(--bg) 60%),
      var(--bg);
    color:var(--ink);
    font-family:"Segoe UI",-apple-system,Roboto,Helvetica,Arial,sans-serif;
    overflow:hidden;
    cursor:pointer;
    -webkit-font-smoothing:antialiased;
  }
  .stage{height:100vh;display:flex;flex-direction:column;padding:18px 26px 8px}

  /* ---------- cabecera mínima ---------- */
  header{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;flex:0 0 auto}
  .kicker{font-size:12.5px;letter-spacing:.14em;color:var(--dim);margin-bottom:6px}
  .title{font-size:30px;font-weight:650;line-height:1.1;transition:opacity .35s}
  .sub{font-size:14.5px;color:var(--dim);margin-top:5px;transition:opacity .35s}
  .title.swap,.sub.swap{opacity:0}

  .eqbox{text-align:right;opacity:0;transition:opacity .5s;flex:0 0 auto}
  .eqbox.on{opacity:1}
  .eq{font-family:"Cambria Math",Cambria,Georgia,serif;font-size:29px;letter-spacing:.5px}
  .eq .tk{transition:color .35s,text-shadow .35s;color:var(--dim)}
  .eq .tk.hot{color:var(--ink)}
  .eq .b0.hot{color:var(--pred);text-shadow:0 0 18px rgba(167,139,250,.55)}
  .eq .b1.hot{color:var(--line);text-shadow:0 0 18px rgba(255,176,32,.5)}
  .eq .er.hot{color:var(--err);text-shadow:0 0 18px rgba(255,92,122,.5)}
  .eqnum{font-family:"Cambria Math",Cambria,Georgia,serif;font-size:17px;color:var(--line);margin-top:6px;opacity:0;transition:opacity .4s}
  .eqnum.on{opacity:1}

  /* ---------- gráfica ---------- */
  .plot{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center}
  svg{width:100%;height:100%}
  .g{opacity:0;transition:opacity .45s ease}
  .g.on{opacity:1}
  .grid line{stroke:var(--grid);stroke-width:1}
  .axis line{stroke:var(--axis);stroke-width:1.6}
  .tick{fill:var(--dim);font-size:13px}
  .axlab{fill:#9fb0cc;font-size:14.5px}
  .dot{fill:var(--pt);opacity:0;transform:scale(.2);transform-box:fill-box;transform-origin:center;
       transition:opacity .45s ease,transform .5s cubic-bezier(.2,1.6,.4,1),r .2s;
       filter:drop-shadow(0 0 7px rgba(57,224,208,.55))}
  .dot.in{opacity:1;transform:scale(1)}
  .dot:hover{r:9}
  .fitline{stroke:var(--line);stroke-width:3.6;stroke-linecap:round;filter:drop-shadow(0 0 14px rgba(255,176,32,.45))}
  .meanline{stroke:#5b6b8c;stroke-width:2;stroke-dasharray:7 7}
  .resid{stroke:var(--err);stroke-width:2.2;opacity:.9}
  .sq{fill:rgba(255,92,122,.17);stroke:rgba(255,92,122,.5);stroke-width:1}
  .guide{stroke:var(--pred);stroke-width:2;stroke-dasharray:6 6}
  .slopeline{stroke:var(--line);stroke-width:2.4}
  .lab{font-size:16px;font-weight:600}
  .lab.amber{fill:var(--line)}
  .lab.violet{fill:var(--pred)}
  .lab.rose{fill:var(--err)}
  .lab.mid{fill:#8fa0bd;font-weight:500;font-size:14px}

  /* ---------- pie ---------- */
  footer{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:18px;height:74px}
  .panel{display:flex;align-items:center;gap:26px;opacity:0;pointer-events:none;transition:opacity .4s}
  .panel.on{opacity:1;pointer-events:auto;cursor:default}
  .ctrl{display:flex;flex-direction:column;gap:5px;min-width:190px}
  .ctrl span{font-size:12.5px;color:var(--dim);font-family:"Cambria Math",Cambria,Georgia,serif}
  input[type=range]{-webkit-appearance:none;appearance:none;height:4px;border-radius:4px;background:#26324c;outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;border-radius:50%;
    background:var(--line);cursor:grab;box-shadow:0 0 12px rgba(255,176,32,.6)}
  input[type=range]::-moz-range-thumb{width:17px;height:17px;border:0;border-radius:50%;background:var(--line);cursor:grab}
  .btn{background:transparent;color:var(--ink);border:1px solid #33415e;border-radius:999px;
       padding:9px 18px;font-size:13.5px;cursor:pointer;transition:border-color .25s,background .25s}
  .btn:hover{border-color:var(--line);background:rgba(255,176,32,.09)}
  .metrics{display:flex;gap:26px;align-items:baseline;margin-left:auto;opacity:0;transition:opacity .4s}
  .metrics.on{opacity:1}
  .metric b{font-family:"Cambria Math",Cambria,Georgia,serif;font-size:23px;font-weight:600}
  .metric i{display:block;font-size:11.5px;color:var(--dim);font-style:normal;margin-top:2px}
  .sse b{color:var(--err)}
  .r2 b{color:var(--pt)}
  .count{font-size:13px;color:#46536e;font-variant-numeric:tabular-nums;margin-left:24px}

  #tip{position:fixed;pointer-events:none;background:#16203a;border:1px solid #2c3a59;border-radius:7px;
       padding:6px 10px;font-size:12.5px;color:var(--ink);opacity:0;transition:opacity .15s;white-space:nowrap;z-index:9}

  @media (max-width:820px){
    .title{font-size:22px}.eq{font-size:21px}.sub{font-size:12.5px}
    footer{height:auto;flex-wrap:wrap;padding-bottom:10px}
    .ctrl{min-width:130px}
  }
  @media (prefers-reduced-motion:reduce){*{transition-duration:.01ms !important}}
</style>
</head>
<body>
<div class="stage">

  <header>
    <div>
      <div class="kicker">Regresión lineal simple · experiencia laboral e ingreso</div>
      <div class="title" id="title">Dos variables</div>
      <div class="sub" id="sub">Cada punto es una persona ocupada</div>
    </div>
    <div class="eqbox" id="eqbox">
      <div class="eq">
        <span class="tk yh">ŷ</span> =
        <span class="tk b0">β₀</span> +
        <span class="tk b1">β₁</span>·<span class="tk xx">x</span>
        <span class="tk er" id="errTok" style="opacity:0"> + ε</span>
      </div>
      <div class="eqnum" id="eqnum"></div>
    </div>
  </header>

  <div class="plot">
    <svg id="svg" viewBox="0 0 1000 540" preserveAspectRatio="xMidYMid meet" aria-label="Diagrama de dispersión con recta de regresión"></svg>
  </div>

  <footer>
    <div class="panel" id="panel">
      <div class="ctrl">
        <span id="lb0">β₀ = 1.62</span>
        <input type="range" id="s0" min="0.4" max="3.2" step="0.01">
      </div>
      <div class="ctrl">
        <span id="lb1">β₁ = 0.31</span>
        <input type="range" id="s1" min="-0.05" max="0.6" step="0.005">
      </div>
      <button class="btn" id="best">Recta óptima</button>
    </div>
    <div class="metrics" id="metrics">
      <div class="metric sse"><b id="mSse">—</b><i>Σ ε²  ·  suma de cuadrados</i></div>
      <div class="metric r2"><b id="mR2">—</b><i>R²  ·  variación explicada</i></div>
    </div>
    <div class="count" id="count">1 / 9</div>
  </footer>
</div>
<div id="tip"></div>

<script>
(function(){
"use strict";

/* ---------------- datos ---------------- */
const DATA=[
 {x:1,y:2.1},{x:1.5,y:1.8},{x:2,y:2.5},{x:2.5,y:2.2},{x:3,y:2.9},{x:3.5,y:2.5},
 {x:4,y:3.1},{x:5,y:3.0},{x:5.5,y:3.6},{x:6,y:3.3},{x:6.5,y:3.9},{x:7,y:3.6},
 {x:8,y:4.4},{x:8.5,y:4.0},{x:9,y:4.6},{x:9.5,y:4.5}
];
const n=DATA.length;
const mx=DATA.reduce((a,d)=>a+d.x,0)/n, my=DATA.reduce((a,d)=>a+d.y,0)/n;
let sxy=0,sxx=0,sst=0;
DATA.forEach(d=>{sxy+=(d.x-mx)*(d.y-my);sxx+=(d.x-mx)**2;sst+=(d.y-my)**2;});
const B1=sxy/sxx, B0=my-B1*mx;

/* ---------------- escalas ---------------- */
const W=1000,H=540,L=76,R=48,T=26,Bm=64;
const XD=[0,10], YD=[1,5];
const sx=x=>L+(x-XD[0])/(XD[1]-XD[0])*(W-L-R);
const sy=y=>(H-Bm)-(y-YD[0])/(YD[1]-YD[0])*(H-Bm-T);
const NS="http://www.w3.org/2000/svg";
const el=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;};
const svg=document.getElementById("svg");
const grp=id=>{const g=el("g",{});g.classList.add("g");g.dataset.id=id;svg.appendChild(g);return g;};

/* ---------------- capas ---------------- */
const gAxes=grp("axes"), gMean=grp("mean"), gResid=grp("resid"), gSquares=grp("squares"),
      gLine=grp("line"), gPred=grp("pred"), gSlope=grp("slope"), gInt=grp("intercept"),
      gPoints=grp("points");

/* ejes y rejilla */
(function(){
  const gr=el("g",{class:"grid"});
  for(let x=XD[0];x<=XD[1];x+=2) gr.appendChild(el("line",{x1:sx(x),y1:T,x2:sx(x),y2:H-Bm}));
  for(let y=YD[0];y<=YD[1];y+=1) gr.appendChild(el("line",{x1:L,y1:sy(y),x2:W-R,y2:sy(y)}));
  gAxes.appendChild(gr);
  const ax=el("g",{class:"axis"});
  ax.appendChild(el("line",{x1:L,y1:H-Bm,x2:W-R,y2:H-Bm}));
  ax.appendChild(el("line",{x1:L,y1:T,x2:L,y2:H-Bm}));
  gAxes.appendChild(ax);
  for(let x=XD[0];x<=XD[1];x+=2){
    const t=el("text",{class:"tick",x:sx(x),y:H-Bm+24,"text-anchor":"middle"});t.textContent=x;gAxes.appendChild(t);
  }
  for(let y=YD[0];y<=YD[1];y+=1){
    const t=el("text",{class:"tick",x:L-14,y:sy(y)+5,"text-anchor":"end"});t.textContent=y.toFixed(1);gAxes.appendChild(t);
  }
  const xl=el("text",{class:"axlab",x:(L+W-R)/2,y:H-16,"text-anchor":"middle"});
  xl.textContent="x — años de experiencia laboral";gAxes.appendChild(xl);
  const yl=el("text",{class:"axlab",x:-(T+H-Bm)/2,y:24,transform:"rotate(-90)","text-anchor":"middle"});
  yl.textContent="y — ingreso mensual (millones de $)";gAxes.appendChild(yl);
})();

/* media */
gMean.appendChild(el("line",{class:"meanline",x1:L,y1:sy(my),x2:W-R,y2:sy(my)}));
const mlab=el("text",{class:"lab mid",x:W-R,y:sy(my)-12,"text-anchor":"end"});
mlab.textContent="promedio de y = "+my.toFixed(2);gMean.appendChild(mlab);

/* recta */
const line=el("line",{class:"fitline"});gLine.appendChild(line);

/* residuos y cuadrados */
const residEls=DATA.map(()=>{const l=el("line",{class:"resid"});gResid.appendChild(l);return l;});
const sqEls=DATA.map(()=>{const r=el("rect",{class:"sq"});gSquares.appendChild(r);return r;});

/* intercepto */
const iDot=el("circle",{class:"idot",r:8,fill:"var(--pred)"});
const iLab=el("text",{class:"lab violet"});
gInt.appendChild(el("line",{class:"guide",x1:L,y1:T,x2:L,y2:H-Bm}));
gInt.appendChild(iDot);gInt.appendChild(iLab);

/* pendiente */
const shor=el("line",{class:"slopeline"}), sver=el("line",{class:"slopeline"});
const slabH=el("text",{class:"lab mid","text-anchor":"middle"}), slabV=el("text",{class:"lab amber"});
slabH.textContent="+1 año";
gSlope.appendChild(shor);gSlope.appendChild(sver);gSlope.appendChild(slabH);gSlope.appendChild(slabV);

/* predicción */
const PX=7.5;
const pv=el("line",{class:"guide"}), ph=el("line",{class:"guide"});
const pdot=el("circle",{r:8,fill:"var(--pred)"});
const plabX=el("text",{class:"lab violet","text-anchor":"middle"}), plabY=el("text",{class:"lab violet","text-anchor":"end"});
plabX.textContent="x = 7.5 años";
gPred.appendChild(pv);gPred.appendChild(ph);gPred.appendChild(pdot);gPred.appendChild(plabX);gPred.appendChild(plabY);

/* puntos */
const tip=document.getElementById("tip");
const dots=DATA.map((d,i)=>{
  const c=el("circle",{class:"dot",cx:sx(d.x),cy:sy(d.y),r:7});
  c.style.transitionDelay=(i*45)+"ms";
  c.addEventListener("mousemove",e=>{
    tip.textContent="x = "+d.x+" años   ·   y = $"+d.y.toFixed(1)+" M   ·   ε = "+(d.y-(st.b0+st.b1*d.x)).toFixed(2);
    tip.style.opacity="1";tip.style.left=(e.clientX+14)+"px";tip.style.top=(e.clientY-34)+"px";
  });
  c.addEventListener("mouseleave",()=>tip.style.opacity="0");
  gPoints.appendChild(c);return c;
});

/* ---------------- estado y dibujo ---------------- */
const st={b0:my,b1:0};
const fy=x=>st.b0+st.b1*x;

function draw(){
  line.setAttribute("x1",sx(XD[0]));line.setAttribute("y1",sy(fy(XD[0])));
  line.setAttribute("x2",sx(XD[1]));line.setAttribute("y2",sy(fy(XD[1])));

  let sse=0;
  DATA.forEach((d,i)=>{
    const yh=fy(d.x), px=sx(d.x), py=sy(d.y), pl=sy(yh), h=Math.abs(py-pl);
    sse+=(d.y-yh)**2;
    residEls[i].setAttribute("x1",px);residEls[i].setAttribute("y1",py);
    residEls[i].setAttribute("x2",px);residEls[i].setAttribute("y2",pl);
    const left = d.x>6.5;
    sqEls[i].setAttribute("x",left?px-h:px);
    sqEls[i].setAttribute("y",Math.min(py,pl));
    sqEls[i].setAttribute("width",h);sqEls[i].setAttribute("height",h);
  });

  /* intercepto */
  iDot.setAttribute("cx",sx(0));iDot.setAttribute("cy",sy(st.b0));
  iLab.setAttribute("x",sx(0)+18);iLab.setAttribute("y",sy(st.b0)-14);
  iLab.textContent="β₀ = "+st.b0.toFixed(2);

  /* pendiente: de x=4 a x=5 */
  const x1=4,x2=5;
  shor.setAttribute("x1",sx(x1));shor.setAttribute("y1",sy(fy(x1)));
  shor.setAttribute("x2",sx(x2));shor.setAttribute("y2",sy(fy(x1)));
  sver.setAttribute("x1",sx(x2));sver.setAttribute("y1",sy(fy(x1)));
  sver.setAttribute("x2",sx(x2));sver.setAttribute("y2",sy(fy(x2)));
  slabH.setAttribute("x",(sx(x1)+sx(x2))/2);slabH.setAttribute("y",sy(fy(x1))+22);
  slabV.setAttribute("x",sx(x2)+14);slabV.setAttribute("y",(sy(fy(x1))+sy(fy(x2)))/2+5);
  slabV.textContent="β₁ = "+st.b1.toFixed(2);

  /* predicción */
  const yp=fy(PX);
  pv.setAttribute("x1",sx(PX));pv.setAttribute("y1",H-Bm);pv.setAttribute("x2",sx(PX));pv.setAttribute("y2",sy(yp));
  ph.setAttribute("x1",sx(PX));ph.setAttribute("y1",sy(yp));ph.setAttribute("x2",L);ph.setAttribute("y2",sy(yp));
  pdot.setAttribute("cx",sx(PX));pdot.setAttribute("cy",sy(yp));
  plabX.setAttribute("x",sx(PX));plabX.setAttribute("y",H-Bm-10);
  plabY.setAttribute("x",L-14);plabY.setAttribute("y",sy(yp)-12);
  plabY.textContent="ŷ = "+yp.toFixed(2);

  /* lecturas */
  const r2=1-sse/sst;
  document.getElementById("mSse").textContent=sse.toFixed(2);
  document.getElementById("mR2").textContent=(r2<0?0:r2).toFixed(2);
  document.getElementById("eqnum").textContent="ŷ = "+st.b0.toFixed(2)+" + "+st.b1.toFixed(2)+" · x";
  document.getElementById("lb0").textContent="β₀ = "+st.b0.toFixed(2);
  document.getElementById("lb1").textContent="β₁ = "+st.b1.toFixed(2);
  s0.value=st.b0;s1.value=st.b1;
}

/* tween */
let raf=null;
function tweenTo(b0,b1,dur,done){
  cancelAnimationFrame(raf);
  const a0=st.b0,a1=st.b1,t0=performance.now();
  (function loop(t){
    const k=Math.min(1,(t-t0)/dur), e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
    st.b0=a0+(b0-a0)*e;st.b1=a1+(b1-a1)*e;draw();
    if(k<1) raf=requestAnimationFrame(loop); else if(done) done();
  })(t0);
}

/* ---------------- pasos ---------------- */
const STEPS=[
 {t:"Dos variables",              s:"Cada punto es una persona ocupada",                     show:["axes","points"]},
 {t:"Sin modelo, solo el promedio",s:"Predecir siempre lo mismo ignora por completo a x",      show:["axes","points","mean"]},
 {t:"El modelo es una recta",      s:"Una sola línea resume cómo x acompaña a y",              show:["axes","points","line"],eq:1,hi:[]},
 {t:"β₀ · el intercepto",          s:"El punto de partida: el valor de y cuando x vale 0",     show:["axes","points","line","intercept"],eq:1,hi:["b0"]},
 {t:"β₁ · la pendiente",           s:"Cuánto sube el ingreso por cada año adicional de experiencia",       show:["axes","points","line","slope"],eq:1,hi:["b1"]},
 {t:"ŷ · la predicción",           s:"Entro con un valor de x y leo el valor esperado de y",   show:["axes","points","line","pred"],eq:1,hi:["yh","xx"]},
 {t:"ε · el residuo",              s:"La distancia entre lo observado y lo predicho",          show:["axes","points","line","resid"],eq:1,hi:["er"],err:1},
 {t:"Mínimos cuadrados",           s:"La mejor recta es la que hace mínima la suma de estas áreas",show:["axes","points","line","resid","squares"],eq:1,hi:["er"],err:1,metrics:1},
 {t:"Ajuste la recta",             s:"Mueva β₀ y β₁ y vea crecer o caer el error",             show:["axes","points","line","resid","squares"],eq:1,metrics:1,panel:1}
];
let i=0, busy=false;

const title=document.getElementById("title"), sub=document.getElementById("sub"),
      eqbox=document.getElementById("eqbox"), eqnum=document.getElementById("eqnum"),
      errTok=document.getElementById("errTok"), panel=document.getElementById("panel"),
      metrics=document.getElementById("metrics"), count=document.getElementById("count"),
      s0=document.getElementById("s0"), s1=document.getElementById("s1");

function render(prev){
  const c=STEPS[i];
  title.classList.add("swap");sub.classList.add("swap");
  setTimeout(()=>{title.textContent=c.t;sub.textContent=c.s;title.classList.remove("swap");sub.classList.remove("swap");},180);

  svg.querySelectorAll(".g").forEach(g=>g.classList.toggle("on",c.show.includes(g.dataset.id)));
  dots.forEach(d=>d.classList.toggle("in",c.show.includes("points")));
  eqbox.classList.toggle("on",!!c.eq);
  eqnum.classList.toggle("on",i>=3);
  errTok.style.opacity=c.err?1:0;
  panel.classList.toggle("on",!!c.panel);
  metrics.classList.toggle("on",!!c.metrics);
  count.textContent=(i+1)+" / "+STEPS.length;
  document.querySelectorAll(".eq .tk").forEach(t=>{
    t.classList.toggle("hot",(c.hi||[]).some(h=>t.classList.contains(h)));
  });

  /* movimiento de la recta según el paso */
  if(i<2){ tweenTo(my,0,500); }
  else if(i===2 && prev<2){ st.b0=my;st.b1=0;draw();tweenTo(B0,B1,1400); }
  else if(i===7 && prev===6){
    busy=true;
    tweenTo(B0+0.85,B1-0.17,900,()=>setTimeout(()=>tweenTo(B0,B1,1300,()=>busy=false),700));
  }
  else if(i!==8){ tweenTo(B0,B1,600); }
}

function go(d){
  if(busy&&d>0) return;
  const p=i;i=Math.max(0,Math.min(STEPS.length-1,i+d));
  if(i!==p) render(p);
}

document.body.addEventListener("click",e=>{if(!e.target.closest("#panel"))go(1);});
document.addEventListener("keydown",e=>{
  if(["ArrowRight"," ","PageDown","ArrowDown"].includes(e.key)){e.preventDefault();go(1);}
  if(["ArrowLeft","PageUp","ArrowUp"].includes(e.key)){e.preventDefault();go(-1);}
  if(e.key==="Home"){i=0;render(1);}
});
[s0,s1].forEach(s=>s.addEventListener("input",()=>{
  cancelAnimationFrame(raf);st.b0=+s0.value;st.b1=+s1.value;draw();
}));
document.getElementById("best").addEventListener("click",()=>tweenTo(B0,B1,800));
panel.addEventListener("click",e=>e.stopPropagation());

st.b0=my;st.b1=0;draw();render(0);
})();
</script>
</body>
</html>
