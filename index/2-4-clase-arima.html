<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modelo ARIMA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Plantilla de la skill presentacion-clase · escenario fijo 1600×900 escalado a la ventana; todo el contenido vive en SVG.
   El primer <script> es GSAP minificado: no editarlo. El código de la clase está en el segundo. */
:root{
  --bg:#ffffff; --ink:#15181f; --sub:#565c6b; --muted:#9aa0ad; --line:#e8eaef;
  --st:#2f5bea; --ml:#ea7317;
  --disp:"Schibsted Grotesk","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden}
#view{position:fixed;inset:0;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;background:var(--bg)}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:50% 50%;overflow:hidden}
.slide{position:absolute;inset:0}
.slide svg{display:block;width:1600px;height:900px}
#pg{position:absolute;right:52px;bottom:34px;font:400 15px var(--mono);color:var(--muted)}
text{font-family:var(--disp)}
.kick{font:500 15px var(--mono);letter-spacing:.16em;fill:var(--muted)}
.ttl{font:600 50px var(--disp);letter-spacing:-.015em;fill:var(--ink)}
.hero{font:700 78px var(--disp);letter-spacing:-.025em;fill:var(--ink)}
.h2{font:600 30px var(--disp);letter-spacing:-.01em;fill:var(--ink)}
.h3{font:600 23px var(--disp);fill:var(--ink)}
.lab{font:500 20px var(--disp);fill:var(--ink)}
.txt{font:400 20px var(--disp);fill:var(--sub)}
.sm{font:400 16px var(--disp);fill:var(--sub)}
.tick{font:400 13px var(--mono);fill:var(--muted)}
.axl{font:500 16px var(--disp);fill:var(--sub)}
.mono{font:500 21px var(--mono);fill:var(--ink)}
.monoL{font:600 40px var(--mono);fill:var(--ink)}
.monoXL{font:600 64px var(--mono);fill:var(--ink)}
.pill{font:600 13px var(--mono);letter-spacing:.14em}
.cell{font:400 19px var(--mono);fill:var(--ink)}
.hdr{font:600 15px var(--disp);fill:var(--sub)}
.nav{font:500 15px var(--disp);fill:var(--muted)}
.nav.on{fill:var(--ink);font-weight:600}
/* índice de láminas: vive fuera del escenario para que sus clics no avancen la presentación */
#ixBtn{position:fixed;top:16px;right:20px;z-index:20;border:1px solid var(--line);background:rgba(255,255,255,.9);color:var(--sub);
  font:600 12px var(--mono);letter-spacing:.1em;padding:9px 14px;border-radius:99px;cursor:pointer;opacity:.55;transition:opacity .2s,background .2s,color .2s}
#ixBtn:hover{opacity:1;background:var(--ink);color:#fff;border-color:var(--ink)}
#ixOv{position:fixed;inset:0;z-index:30;background:rgba(21,24,31,.3);opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
#ixOv.open{opacity:1;visibility:visible}
#ixPanel{position:absolute;top:0;right:0;height:100%;width:min(430px,92vw);box-sizing:border-box;background:#fff;border-left:1px solid var(--line);
  padding:22px 20px 28px;overflow-y:auto;transform:translateX(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1);font-family:var(--disp);color:var(--ink)}
#ixOv.open #ixPanel{transform:none}
.ix-h{display:flex;justify-content:space-between;align-items:center;font:600 11px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--st)}
#ixX{border:none;background:#f5f6f8;width:34px;height:34px;border-radius:50%;cursor:pointer;color:var(--ink);font-size:14px}
#ixX:hover{background:var(--ml);color:#fff}
.ix-back{display:inline-block;margin-top:14px;font:500 13px var(--disp);color:var(--sub);text-decoration:none}
.ix-back:hover{color:var(--st)}
.ix-g{font:500 10.5px var(--mono);letter-spacing:.16em;color:var(--muted);margin:18px 0 6px}
#ixBody ul{list-style:none;margin:0;padding:0}
#ixBody li{display:flex;align-items:baseline;gap:12px;padding:8px 10px;border-radius:10px;cursor:pointer;font:500 15px/1.25 var(--disp)}
#ixBody li span{font:600 11px var(--mono);color:var(--ml);flex:none}
#ixBody li:hover{background:#f5f6f8}
#ixBody li.cur{background:var(--st);color:#fff}
#ixBody li.cur span{color:#fff;opacity:.75}
@media (prefers-reduced-motion: reduce){#stage *{transition:none!important}#ixOv,#ixPanel{transition:none}}
</style>

</head>
<body>
<div id="view"><div id="stage"><div id="pg"></div></div></div>
<button id="ixBtn" aria-label="Índice de láminas">☰ Índice</button>
<div id="ixOv"><div id="ixPanel">
  <div class="ix-h"><span>Ir a una lámina</span><button id="ixX" aria-label="Cerrar">✕</button></div>
  <a class="ix-back" id="ixBack" href="../index.html">← Volver al curso</a>
  <div id="ixBody"></div>
</div></div>

/* fórmula con aspecto de artículo: \frac{a}{b}, ^{…}, _{…} (juntos se apilan), \sum_{…}^{…}, \sqrt{…}, \c{color}{…},
   \t{texto} (en redonda) y \under{min}{w, b} (índice debajo); las letras sueltas (x, w, γ) van en cursiva, salvo la e */
const MATHF="'STIX Two Text','Cambria Math','Times New Roman',serif";
function formula(p,x,y,tex,o={}){const size=o.size||30,g=G(p),tmp=G(g);
  function parse(s){const out=[];let i=0,buf='';const flush=()=>{if(buf){out.push({t:'txt',s:buf});buf='';}};
    const grupo=()=>{if(s[i]==='{'){let d=1,j=i+1;while(j<s.length&&d){if(s[j]==='{')d++;else if(s[j]==='}')d--;j++;}const r=s.slice(i+1,j-1);i=j;return r;}return s[i++];};
    while(i<s.length){if(s.startsWith('\\frac',i)){flush();i+=5;const a=grupo(),b=grupo();out.push({t:'frac',a:parse(a),b:parse(b)});}
      else if(s.startsWith('\\sum',i)){flush();i+=4;let lo=[],hi=[];while(s[i]==='_'||s[i]==='^'){const k=s[i++],v=parse(grupo());if(k==='_')lo=v;else hi=v;}out.push({t:'sum',lo,hi});}
      else if(s.startsWith('\\sqrt',i)){flush();i+=5;out.push({t:'sqrt',a:parse(grupo())});}
      else if(s.startsWith('\\under',i)){flush();i+=6;const a=grupo(),b=grupo();out.push({t:'under',a:parse(a),b:parse(b)});}
      else if(s.startsWith('\\c{',i)){flush();i+=2;const c=grupo(),a=grupo();out.push({t:'col',c,a:parse(a)});}
      else if(s.startsWith('\\t{',i)){flush();i+=2;out.push({t:'rm',s:grupo()});}
      else if(s[i]==='^'||s[i]==='_'){flush();const k=s[i++];out.push({t:k==='^'?'sup':'sub',a:parse(grupo())});}
      else buf+=s[i++];}
    flush();return out;}
  const runs=(s,rm)=>(s.match(/[\p{L}\p{M}]+|[^\p{L}\p{M}]+/gu)||[]).map(w=>({s:w.replace(/ /g,' '),it:!rm&&/^\p{L}\p{M}*$/u.test(w)&&w!=='e'}));
  const escribir=(gg,rs,sz,x0,y0,col)=>{const t=S('text',{x:x0,y:y0,'font-size':sz,style:`font-family:${MATHF};fill:${col}`},gg);
    rs.forEach(r=>{const s2=S('tspan',{'font-style':r.it?'italic':'normal'},t);s2.textContent=r.s;});return t;};
  function txt(s,sz,col,rm){const rs=runs(s,rm),el=escribir(tmp,rs,sz,0,0,col),w=el.getComputedTextLength();el.remove();
    return{w,asc:sz*.72,desc:sz*.22,draw:(gg,x0,y0)=>escribir(gg,rs,sz,x0,y0,col)};}
  function fila(items,sz,col){const parts=[];let w=0,asc=sz*.72,desc=sz*.22;
    for(let n=0;n<items.length;n++){const it=items[n];let b;
      if(it.t==='txt'||it.t==='rm')b=txt(it.s,sz,col,it.t==='rm');
      else if(it.t==='col')b=fila(it.a,sz,C[it.c]||it.c);
      else if(it.t==='frac'){const A=fila(it.a,sz*.84,col),B=fila(it.b,sz*.84,col),ww=Math.max(A.w,B.w)+sz*.32,ax=sz*.3,gap=sz*.16;
        b={w:ww,asc:ax+gap+A.desc+A.asc,desc:Math.max(0,-ax+gap+B.asc+B.desc),draw:(gg,x0,y0)=>{
          S('line',{x1:x0+sz*.06,x2:x0+ww-sz*.06,y1:y0-ax,y2:y0-ax,stroke:col,'stroke-width':Math.max(1.3,sz*.05)},gg);
          A.draw(gg,x0+(ww-A.w)/2,y0-ax-gap-A.desc);B.draw(gg,x0+(ww-B.w)/2,y0-ax+gap+B.asc);}};}
      else if(it.t==='sum'){const Z=sz*1.45,E=txt('∑',Z,col),lo=fila(it.lo,sz*.6,col),hi=fila(it.hi,sz*.6,col),gap=sz*.1,ww=Math.max(E.w,lo.w,hi.w)+sz*.12;
        const top=Z*.66,bot=Z*.27;   // el ∑ se baja un poco para quedar centrado en el eje de la fórmula
        b={w:ww,asc:top+gap+(it.hi.length?hi.asc+hi.desc:0),desc:bot+gap+(it.lo.length?lo.asc+lo.desc:0),draw:(gg,x0,y0)=>{
          E.draw(gg,x0+(ww-E.w)/2,y0+Z*.08);if(it.hi.length)hi.draw(gg,x0+(ww-hi.w)/2,y0-top-gap-hi.desc);

      else if(it.t==='under'){const A=fila(it.a,sz,col),B=fila(it.b,sz*.62,col),gap=sz*.08,ww=Math.max(A.w,B.w)+sz*.1;

      else if(it.t==='sqrt'){const A=fila(it.a,sz,col),pad=sz*.12,rw=sz*.6,top=A.asc+pad,sw=Math.max(1.3,sz*.05);
        b={w:rw+A.w+pad*2,asc:top+sw,desc:A.desc+sw,draw:(gg,x0,y0)=>{
          S('path',{d:`M${x0+sz*.04},${y0-A.asc*.42} L${x0+rw*.28},${y0-A.asc*.52} L${x0+rw*.58},${y0+A.desc} L${x0+rw},${y0-top} L${x0+rw+A.w+pad*1.6},${y0-top}`,
            fill:'none',stroke:col,'stroke-width':sw,'stroke-linejoin':'round','stroke-linecap':'round'},gg);A.draw(gg,x0+rw+pad*.8,y0);}};}
      else{const nx=items[n+1],par=nx&&(nx.t==='sup'||nx.t==='sub')&&nx.t!==it.t;   // x^{2}_{i}: índice y exponente apilados

      parts.push({b,x:w});w+=b.w;asc=Math.max(asc,b.asc);desc=Math.max(desc,b.desc);}

/* ---------- cálculos de series ---------- */
/* autocorrelación de x hasta el rezago K (r[0] = 1) */
function acf(x,K){const n=x.length,m=mean(x),d=x.map(v=>v-m),c0=d.reduce((s,v)=>s+v*v,0);
  return Array.from({length:K+1},(_,k)=>{let s=0;for(let t=k;t<n;t++)s+=d[t]*d[t-k];return s/c0;});}
/* media y desviación estándar móviles (ventana hacia atrás de w datos) */
function movil(x,w){return x.map((_,i)=>{if(i<w-1)return null;const s=x.slice(i-w+1,i+1),m=mean(s);return{m,sd:Math.sqrt(mean(s.map(v=>(v-m)**2)))};});}
const desv=x=>{const m=mean(x);return Math.sqrt(mean(x.map(v=>(v-m)**2)));};
const pearson=(a,b)=>{const ma=mean(a),mb=mean(b);let s=0,sa=0,sb=0;a.forEach((v,i)=>{s+=(v-ma)*(b[i]-mb);sa+=(v-ma)**2;sb+=(b[i]-mb)**2;});return s/Math.sqrt(sa*sb);};

/* ---------- dibujo ---------- */
/* flecha recta de (x1,y1) a (x2,y2) */
function flecha(p,x1,y1,x2,y2,col=C.ink,sw=2.5){const gg=G(p),a=Math.atan2(y2-y1,x2-x1);
  S('line',{x1,y1,x2:x2-Math.cos(a)*6,y2:y2-Math.sin(a)*6,stroke:col,'stroke-width':sw},gg);arrowHead(gg,x2,y2,a*180/Math.PI,col,.8);return gg;}
/* un pulso que viaja de a hasta b */
function pulso(T,g,a,b,at,d=.6,col=C.ml,r=7){const p=S('circle',{cx:a.x,cy:a.y,r,fill:col,stroke:C.w,'stroke-width':2},g);gsap.set(p,{opacity:0});
  T.to(p,{opacity:1,duration:.08},at);T.to(p,{attr:{cx:b.x,cy:b.y},duration:d,ease:'power1.inOut'},at);T.to(p,{opacity:0,duration:.15},at+d);return p;}
/* la línea de una serie sobre unos ejes; x0 = índice del primer dato; los null cortan la línea */
function linea(g,A,ys,o={}){const x0=o.x0||0,tramos=[[]];ys.forEach((v,i)=>{if(v==null){if(tramos[tramos.length-1].length)tramos.push([]);}else tramos[tramos.length-1].push([A.sx(x0+i),A.sy(v)]);});
  const d=tramos.filter(t=>t.length).map(t=>pathD(t)).join('');
  return S('path',{d,fill:'none',stroke:o.col||C.ink,'stroke-width':o.w||2.5,'stroke-dasharray':o.dash||'none','stroke-linejoin':'round'},g);}
/* banda entre dos curvas (lo de abajo y lo de arriba), con el mismo índice */
function banda(g,A,lo,hi,o={}){const x0=o.x0||0,pts=[];lo.forEach((v,i)=>{if(v!=null)pts.push([A.sx(x0+i),A.sy(v)]);});
  const top=[];hi.forEach((v,i)=>{if(v!=null)top.push([A.sx(x0+i),A.sy(v)]);});
  return S('path',{d:pathD([...pts,...top.reverse()])+'Z',fill:o.fill||C.mlT,stroke:'none',opacity:o.op??1},g);}
/* correlograma: una barra por rezago y la banda ±1,96/√n (lo que cae dentro se puede atribuir al azar) */
function correlograma(g,x,y,w,h,r,o={}){const K=r.length-1,A=axes(g,{x,y,w,h,xd:[0,K+1],yd:[-1,1],xt:o.xt||[0,6,12,18,24].filter(v=>v<=K),yt:[-1,0,1],fy:v=>sn(v,0),xl:o.xl??'rezago k',yl:o.yl});
  const z=A.sy(0),bw=Math.max(3,w/(K+2)*.55),gB=G(g),bnd=o.n?1.96/Math.sqrt(o.n):null;
  S('line',{x1:x,x2:x+w,y1:z,y2:z,stroke:C.frame,'stroke-width':1.5},gB);
  if(bnd)[bnd,-bnd].forEach(b=>S('line',{x1:x,x2:x+w,y1:A.sy(b),y2:A.sy(b),stroke:C.muted,'stroke-width':1.5,'stroke-dasharray':'5 5'},gB));
  const bars=r.map((v,k)=>k===0?null:S('rect',{x:A.sx(k)-bw/2,y:Math.min(z,A.sy(v)),width:bw,height:Math.max(Math.abs(A.sy(v)-z),.5),fill:o.col?o.col(k,v):C.st},g)).filter(Boolean);
  return{A,bars,gB,z,bnd};}
/* barras que crecen desde el cero */
function crecer(T,bars,z,at,st=.03){bars.forEach((b,i)=>T.from(b,{attr:{y:z,height:0},duration:.35,ease:'power2.out'},at+i*st));}
/* una ficha con texto: el rectángulo se mide al texto; (x, y) es la esquina de arriba a la izquierda */
function ficha(p,x,y,t,o={}){const gg=G(p),pad=o.pad??26,h=o.h||44,te=tx(gg,x+pad/2,y+h/2+7,t,o.cls||'lab',{style:o.st||''});
  const w=te.getComputedTextLength()+pad,r=S('rect',{x,y,width:w,height:h,rx:12,fill:o.fill||C.soft,stroke:o.stroke||'none','stroke-width':2},gg);
  gg.insertBefore(r,te);return{g:gg,r,t:te,w,x,y,h};}
/* ejes de la TRM mensual, con años en el eje x */
const ejesTRM=(g,o)=>axes(g,Object.assign({xd:[0,TRM.length-1],yd:[1500,5000],xt:[0,48,96,144,192],fx:i=>2010+i/12,yt:[2000,3000,4000,5000],fy:miles,yl:'TRM (pesos por dólar)'},o));

/* ---------- modelos AR, MA y ARIMA: cálculos ---------- */
/* autocorrelación parcial por Durbin-Levinson (p[0] = 1) */
function pacf(x,K){const r=acf(x,K),P=[1];let phi=[];
  for(let k=1;k<=K;k++){let num=r[k],den=1;for(let j=1;j<k;j++){num-=phi[j-1]*r[k-j];den-=phi[j-1]*r[j];}
    const a=num/den,nuevo=phi.map((v,j)=>v-a*phi[k-2-j]);nuevo.push(a);phi=nuevo;P.push(a);}return P;}
/* mínimos cuadrados: X (filas) e y → coeficientes, resolviendo las ecuaciones normales */
function ols(X,y){const k=X[0].length,A=Array.from({length:k},()=>Array(k+1).fill(0));
  X.forEach((f,i)=>{for(let a=0;a<k;a++){for(let b=0;b<k;b++)A[a][b]+=f[a]*f[b];A[a][k]+=f[a]*y[i];}});
  for(let c=0;c<k;c++){let p=c;for(let r=c+1;r<k;r++)if(Math.abs(A[r][c])>Math.abs(A[p][c]))p=r;[A[c],A[p]]=[A[p],A[c]];
    for(let r=0;r<k;r++)if(r!==c){const f=A[r][c]/A[c][c];for(let j=c;j<=k;j++)A[r][j]-=f*A[c][j];}}
  return A.map((f,i)=>f[k]/f[i]);}
/* Nelder-Mead: minimiza f desde x0 */
function nelder(f,x0,it=600,paso=.1){const n=x0.length;let S=[x0,...x0.map((_,i)=>x0.map((v,j)=>j===i?v+(Math.abs(v)>.05?v*.5:paso):v))].map(p=>({p,v:f(p)}));
  for(let k=0;k<it;k++){S.sort((a,b)=>a.v-b.v);const c=Array(n).fill(0);for(let i=0;i<n;i++)for(let j=0;j<n;j++)c[j]+=S[i].p[j]/n;
    const w=S[n],mov=t=>c.map((v,j)=>v+t*(w.p[j]-v)),r=mov(-1),fr=f(r);
    if(fr<S[0].v){const e=mov(-2),fe=f(e);S[n]=fe<fr?{p:e,v:fe}:{p:r,v:fr};}
    else if(fr<S[n-1].v)S[n]={p:r,v:fr};
    else{const q=mov(.5),fq=f(q);if(fq<w.v)S[n]={p:q,v:fq};else S=S.map((s,i)=>i?{p:s.p.map((v,j)=>S[0].p[j]+.5*(v-S[0].p[j])),v:0}:s).map(s=>({p:s.p,v:f(s.p)}));}}
  S.sort((a,b)=>a.v-b.v);return S[0];}
/* ARMA(p,q) con constante sobre w, por suma de cuadrados condicional: devuelve los errores */
function armaRes(w,c,ph,th){const p=ph.length,q=th.length,e=Array(w.length).fill(0);
  for(let t=0;t<w.length;t++){let m=c;for(let i=1;i<=p;i++)m+=ph[i-1]*(t-i>=0?w[t-i]:0);for(let j=1;j<=q;j++)m+=th[j-1]*(t-j>=0?e[t-j]:0);e[t]=w[t]-m;}return e;}
/* ARIMA(p,1,q) sobre y: se ajusta a las diferencias; AIC = n·ln(SSE/n) + 2k */
function arima(y,p,q){const w=y.slice(1).map((v,i)=>v-y[i]),m=Math.max(p,q),k=1+p+q;
  const un=v=>({c:v[0],ph:v.slice(1,1+p),th:v.slice(1+p)});
  const f=v=>{const P=un(v);if(P.ph.some(a=>Math.abs(a)>.99)||P.th.some(a=>Math.abs(a)>.99))return 1e30;const e=armaRes(w,P.c,P.ph,P.th);let s=0;for(let t=m;t<e.length;t++)s+=e[t]*e[t];return s;};
  const B=nelder(f,[mean(w),...Array(p+q).fill(.1)],900),P=un(B.p),n=w.length-m,s2=B.v/n;
  return{p,q,...P,sse:B.v,s2,aic:n*Math.log(s2)+2*k,e:armaRes(w,P.c,P.ph,P.th)};}
/* pronóstico de h pasos desde el final de y (los errores futuros valen 0) con su desviación (pesos ψ acumulados) */
function pronostico(y,M,h){const w=y.slice(1).map((v,i)=>v-y[i]),e=armaRes(w,M.c,M.ph,M.th).slice(),W=w.slice(),out=[];let nivel=y[y.length-1];
  for(let k=0;k<h;k++){const t=W.length;let m=M.c;M.ph.forEach((a,i)=>m+=a*W[t-1-i]);M.th.forEach((b,j)=>m+=b*(e[t-1-j]||0));W.push(m);e.push(0);nivel+=m;out.push(nivel);}
  const psi=[1];for(let j=1;j<h;j++){let s=j<=M.th.length?M.th[j-1]:0;M.ph.forEach((a,i)=>{if(j-1-i>=0)s+=a*psi[j-1-i];});psi.push(s);}
  let acu=0,v=0;const sd=[];for(let j=0;j<h;j++){acu+=psi[j];v+=acu*acu;sd.push(Math.sqrt(M.s2*v));}
  return{y:out,sd};}
/* pronóstico a un paso con parámetros fijos, para cada t desde ini (la historia real va entrando) */
function unPaso(y,M,ini){const w=y.slice(1).map((v,i)=>v-y[i]),e=armaRes(w,M.c,M.ph,M.th),f=[];
  for(let t=ini;t<y.length;t++){const j=t-1;let m=M.c;M.ph.forEach((a,i)=>m+=a*(j-1-i>=0?w[j-1-i]:0));M.th.forEach((b,i)=>m+=b*(j-1-i>=0?e[j-1-i]:0));f.push(y[t-1]+m);}return f;}
const metricas=(real,pred)=>{const e=real.map((v,i)=>v-pred[i]);return{mae:mean(e.map(Math.abs)),rmse:Math.sqrt(mean(e.map(v=>v*v))),mape:mean(e.map((v,i)=>Math.abs(v/real[i])))};};

/* =====================================================================
   Datos de la clase
   ===================================================================== */
/* temperatura de 30 días, hora a hora (SIMULADA): ciclo diario + choques que duran unas horas */
const TEMP=memo('temp',()=>{const r=rng(24);let ar=0;const T=[];for(let t=0;t<720;t++){ar=.7*ar+randn(r)*.8;T.push(14+5*Math.sin(2*Math.PI*((t%24)-9)/24)+ar);}return T;});
const DIA0=24*10;                                                    // el día que se muestra (horas 0 a 24)
/* AR con los rezagos 1, 2 y 24, estimado por mínimos cuadrados con los 30 días */
const ARF=memo('arf',()=>{const X=[],Y=[];for(let t=24;t<TEMP.length;t++){X.push([1,TEMP[t-1],TEMP[t-2],TEMP[t-24]]);Y.push(TEMP[t]);}
  const b=ols(X,Y),aj=X.map(f=>f.reduce((s,v,i)=>s+v*b[i],0));return{b,aj,mae:mean(aj.map((v,i)=>Math.abs(v-Y[i])))};});
/* series de juguete: un AR(2) y un MA(1), 300 datos cada una (semillas elegidas para que se vea la regla) */
const AR2=memo('ar2',()=>{const r=rng(3),A=[0,0];for(let t=2;t<330;t++)A.push(.6*A[t-1]+.3*A[t-2]+randn(r));return A.slice(30);});
const MA1=memo('ma1',()=>{const r=rng(3),E=Array.from({length:301},()=>randn(r));return{E:E.slice(1),y:E.slice(1).map((e,i)=>e+.8*E[i])};});
/* ARIMA(p, 1, q) sobre la TRM de entrenamiento: rejilla p, q ∈ {0, 1, 2} y el menor AIC */
const TR=TRM.slice(0,NTR);
const REJ=memo('rej',()=>{const G=[];for(let p=0;p<=2;p++)for(let q=0;q<=2;q++)G.push(arima(TR,p,q));return G;});
const MEJ=memo('mej',()=>REJ.reduce((a,b)=>a.aic<b.aic?a:b));
const FULL=memo('full',()=>arima(TRM,MEJ.p,MEJ.q));                 // el mismo orden, con toda la serie (portada e integrar)
/* origen móvil: 5 rondas; cada una reestima con todo lo anterior y pronostica 8 meses, un paso a la vez */
const ROL=memo('rol',()=>{const R=[],pa=[],pn=[],re=[];for(let k=0;k<5;k++){const e=NTR+8*k,M=arima(TRM.slice(0,e),MEJ.p,MEJ.q),f=unPaso(TRM.slice(0,e+8),M,e);
    const real=TRM.slice(e,e+8),nv=TRM.slice(e-1,e+7);R.push({e,a:metricas(real,f).mae,n:metricas(real,nv).mae});pa.push(...f);pn.push(...nv);re.push(...real);}
  return{R,A:metricas(re,pa),N:metricas(re,pn),pa};});
const ecMej=()=>{const M=MEJ,t=['Δy_{t} = '+fc(M.c,1)];M.ph.forEach((a,i)=>t.push(`${a<0?'−':'+'} ${fc(Math.abs(a),2)}Δy_{t−${i+1}}`));M.th.forEach((b,i)=>t.push(`${b<0?'−':'+'} ${fc(Math.abs(b),2)}ε_{t−${i+1}}`));return t.join(' ')+' + ε_{t}';};

  btn.onclick=()=>open(true);document.getElementById('ixX').onclick=()=>open(false);ov.onclick=e=>{if(e.target===ov)open(false);};
  /* en captura: con el índice abierto las teclas no mueven la presentación */
  addEventListener('keydown',e=>{const on=ov.classList.contains('open');
    if(!on&&e.target.closest&&e.target.closest('input,textarea,select'))return;
    if((e.key==='i'||e.key==='I')&&!e.ctrlKey&&!e.metaKey&&!e.altKey){open(!on);e.stopImmediatePropagation();}
    else if(on){if(e.key==='Escape')open(false);e.stopImmediatePropagation();}},true);
})();
{const vb=document.getElementById('ixBack');if(VOLVER)vb.href=VOLVER;else vb.remove();}
/* #n en la URL abre la lámina n (1 = portada) ya armada: sirve para revisar y para scripts/capturar.ps1 */
const start=()=>{const m=/^#(\d+)$/.exec(location.hash);if(m&&+m[1]>=1&&+m[1]<=SLIDES.length)render(+m[1]-1,-1,'instant',0);else render(0,0,'anim',0);};
/* se espera a las fuentes (formula() mide el texto con STIX Two Text) */
if(document.fonts&&document.fonts.ready)Promise.race([Promise.all([document.fonts.ready,document.fonts.load("30px 'STIX Two Text'"),document.fonts.load("italic 30px 'STIX Two Text'")]),new Promise(r=>setTimeout(r,2500))]).then(start);else start();
</script>
