<title>Machine Learning para el territorio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Escenario 16:9 fijo y escalado; columna izquierda = pregunta y frase, derecha = visual animado */
:root{
  --bg:#FFFFFF; --ink:#121A2C; --soft:#5D6679; --mute:#A3AABA; --line:#E4E7EF; --faint:#F3F5F9;
  --blue:#2A4DD6; --amber:#E39A10; --green:#13916A; --red:#D8432C;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden}
body{font-family:var(--display);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;cursor:default}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center}
.slide{position:absolute;inset:0;opacity:0;transform:translateX(80px);filter:blur(6px);transition:opacity .6s ease,transform .9s cubic-bezier(.2,.8,.2,1),filter .6s ease;pointer-events:none}
.slide.left{transform:translateX(-80px)}
.slide.active{opacity:1;transform:none;filter:none;pointer-events:auto}

.hd{position:absolute;left:80px;top:92px;width:350px}
.eyebrow{font:500 13px/1.2 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--blue)}
.hd h2{font-size:50px;line-height:1.02;letter-spacing:-.028em;font-weight:720;margin:18px 0 0;text-wrap:balance}
.q{font-size:20px;line-height:1.38;color:var(--soft);margin:22px 0 0;text-wrap:pretty}
.slide.active .hd>*{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
.slide.active .hd>*:nth-child(2){animation-delay:.08s}
.slide.active .hd>*:nth-child(3){animation-delay:.18s}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.cap{position:absolute;left:80px;top:488px;width:340px;font-size:22px;line-height:1.32;font-weight:520;letter-spacing:-.005em;transition:opacity .25s ease,transform .35s ease;text-wrap:pretty}
.cap::before{content:"";display:block;width:28px;height:3px;background:var(--blue);margin-bottom:16px;border-radius:2px}
.cap.swap{opacity:0;transform:translateY(8px)}
.viz{position:absolute;left:460px;top:80px;width:760px;height:540px;overflow:visible}
.pg{position:absolute;right:60px;bottom:38px;font:500 13px var(--mono);color:var(--ink);letter-spacing:.06em}
.pg span{color:var(--mute)}
.sim{position:absolute;left:80px;bottom:40px;font:400 11px var(--mono);color:var(--mute);letter-spacing:.04em}

/* estados de paso */
.pop{opacity:0;transform:translateY(12px) scale(.94);transition:opacity .55s ease var(--d,0s),transform .8s cubic-bezier(.2,.9,.25,1) var(--d,0s)}
svg .pop,svg .popdot{transform-box:fill-box;transform-origin:center}
.pop.on{opacity:1;transform:none}
.pop.on.off{opacity:0;transform:scale(.96)}
.popdot{opacity:0;transform:scale(0);transition:opacity .3s ease var(--d,0s),transform .6s cubic-bezier(.34,1.56,.64,1) var(--d,0s),fill .6s ease}
.popdot.on{opacity:1;transform:none}
.popdot.on.off{opacity:0;transform:scale(.4)}
.fade{opacity:0;transition:opacity .6s ease var(--d,0s)}
.fade.on{opacity:1}
.fade.on.off{opacity:0}
.draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);transition:stroke-dashoffset 1.1s cubic-bezier(.6,0,.2,1) var(--d,0s),opacity .4s ease}
.draw.on{stroke-dashoffset:0}
.draw.on.off{opacity:0}
.instant,.instant *{transition:none!important}

/* svg */
svg text{font-family:var(--display);fill:var(--ink)}
.tick{font:400 12.5px var(--mono);fill:var(--soft)}
.alabel{font:500 12.5px var(--mono);fill:var(--soft);letter-spacing:.02em}
.grid{stroke:var(--line);stroke-width:1}
.axis{stroke:var(--ink);stroke-width:1.2}
.lbl{font-weight:540;font-size:16px}
.lblw{font-weight:600;font-size:17px;fill:var(--bg)!important}
.tag{font:500 12.5px var(--mono);fill:var(--soft)}
.stat{font:500 14px var(--mono);fill:var(--ink)}
.eq{font:500 15px var(--mono);fill:var(--blue)}
.bigs{font-weight:700;font-size:22px;letter-spacing:-.01em}
.big{font-weight:740;font-size:30px;letter-spacing:-.02em}
.halo{paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}
.pt{transition:fill .6s ease,opacity .3s ease var(--d,0s),transform .6s cubic-bezier(.34,1.56,.64,1) var(--d,0s)}
.fit{stroke:var(--blue);stroke-width:3;stroke-linecap:round}
.resid{stroke:var(--red);stroke-width:1.6;opacity:.75}
.guide{stroke:var(--blue);stroke-width:1.5;stroke-dasharray:5 5;fill:none}
.guide.draw{stroke-dasharray:var(--len)}
.ring-pulse{animation:pulse 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%{transform:scale(.7);opacity:.9}100%{transform:scale(2.3);opacity:0}}
.spin{animation:spin 9s linear infinite;animation-play-state:paused;transform-box:fill-box;transform-origin:center}
.spin.rev{animation-direction:reverse;animation-duration:13s}
.run .spin,.closing .spin{animation-play-state:running}
@keyframes spin{to{transform:rotate(360deg)}}
.flow{fill:none;stroke:var(--line);stroke-width:2}
.nroot{fill:var(--ink)}
.nroot-t{fill:var(--bg)!important;font-weight:620;font-size:17px}
.nfam{fill:var(--bg);stroke:var(--ink);stroke-width:1.5}
.nfam-t{font-weight:620;font-size:17px}
.edge{fill:none;stroke:var(--mute);stroke-width:1.6;transition:stroke .3s ease,stroke-width .3s ease,stroke-dashoffset 1.1s cubic-bezier(.6,0,.2,1) var(--d,0s),opacity .4s}
.edge.hl{stroke:var(--blue);stroke-width:3.2}
.node rect{fill:var(--bg);stroke:var(--ink);stroke-width:1.5;transition:stroke-width .3s,fill .3s}
.node text{font-weight:540;font-size:15px}
.node.no rect{fill:var(--faint);stroke:var(--mute)}
.node.hi rect{fill:#FBE9E5;stroke:var(--red)}
.node.mid rect{fill:#FCF1DC;stroke:var(--amber)}
.node.hit rect{stroke-width:3.5}
.node.hit{animation:bump .6s cubic-bezier(.34,1.56,.64,1)}
@keyframes bump{50%{transform:scale(1.07)}}
.cell{transition:opacity .3s ease var(--d,0s),transform .6s cubic-bezier(.34,1.56,.64,1) var(--d,0s),fill .7s ease}
.mt line{stroke:var(--mute);stroke-width:1.5;transition:stroke .3s,stroke-width .3s}
.mt line.hl{stroke:var(--ink);stroke-width:2.6}
.mt circle{fill:var(--mute);transition:fill .3s}
.mt circle.lf{fill:var(--faint);stroke:var(--mute);stroke-width:1.2}
.aring{fill:none;stroke:var(--red);stroke-width:2;opacity:0;transition:opacity .25s}
.aring.show{opacity:1}
.shade{fill:var(--red);fill-opacity:.06}
.thr{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:4 4}
.curve{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round}
.curve.draw{transition-duration:1.8s}
.cand{stroke:var(--mute);stroke-width:2}
.svmline{stroke:var(--ink);stroke-width:3}
.marg{stroke:var(--ink);stroke-width:1.3;stroke-dasharray:6 5}
.spoke{stroke-width:1;opacity:.35}
.pcline{stroke:var(--blue);stroke-width:2.5}
.nn{stroke:var(--line);stroke-width:1}
.fan{stroke:var(--mute);stroke-width:1;stroke-dasharray:var(--len)}
.cut{stroke-width:2}
.hit{fill:transparent;cursor:crosshair}

/* portada */
.tl{position:absolute;left:80px;top:140px;width:560px}
.tl h1{font-size:74px;line-height:.98;letter-spacing:-.035em;font-weight:760;margin:26px 0 0;text-wrap:balance}
.w{display:inline-block}
.slide.active .w{animation:rise 1s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(.15s + var(--i)*.07s)}
.slide.active .tl .eyebrow{animation:rise .8s both}
.sub{font-size:21px;line-height:1.4;color:var(--soft);margin:28px 0 0;max-width:470px}
.slide.active .sub{animation:rise 1s .7s both}
.by{margin-top:52px;font:500 13px/1.75 var(--mono);color:var(--ink);letter-spacing:.04em}
.by span{display:block;color:var(--soft)}
.slide.active .by{animation:rise 1s .9s both}
.field{position:absolute;left:650px;top:50px;width:600px;height:600px}
.fieldcap{position:absolute;left:670px;bottom:40px;font:400 12px var(--mono);color:var(--soft)}

/* cierre */
.closing{position:absolute;left:470px;top:110px;width:750px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:30px}
.pnl{min-width:0}
.pnl svg{width:100%;height:auto;display:block;overflow:visible}
.pnl h3{font-size:23px;line-height:1.1;letter-spacing:-.015em;font-weight:680;margin:26px 0 0;text-wrap:balance}
.pnl p{font-size:16px;line-height:1.45;color:var(--soft);margin:12px 0 0}
.pnl .ex{font:500 11.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--blue);margin-top:18px}

@media (prefers-reduced-motion: reduce){
  .slide{transition:opacity .3s ease;transform:none!important;filter:none!important}
  *{animation-duration:.01ms!important;animation-iteration-count:1!important}
}
/* ---------- esquema de apertura: raíz → 3 familias → 7 tipos de pregunta → 11 técnicas (pasos 0 intro · 1 familias · 2–8 columnas · 9 vista completa) ---------- */
.mp{--ez:cubic-bezier(.2,.8,.2,1)}
.mp svg.m-ln{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.mp .m-p{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 1;stroke-dashoffset:1;transition:stroke-dashoffset .7s var(--ez) var(--d,0s)}
.mp .m-p.on{stroke-dashoffset:0}
.mp .m-kick,.mp .m-by{position:absolute;left:0;right:0;text-align:center;transition:opacity .6s,transform .9s var(--ez)}
.mp .m-kick{top:236px;font:500 13px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--soft)}
.mp .m-by{top:452px;font:500 13px var(--mono);color:var(--mute);letter-spacing:.06em}
.mp .m-rainbow{position:absolute;left:50%;top:420px;width:300px;height:5px;margin-left:-150px;border-radius:9px;
  background:linear-gradient(90deg,#2A4DD6,#0E8FA8,#13916A,#E39A10,#C9367A,#D8432C,#7B3FD1);transition:opacity .6s,transform .9s var(--ez)}
.mp:not(.intro) .m-kick,.mp:not(.intro) .m-by{opacity:0;transform:translateY(-14px)}
.mp:not(.intro) .m-rainbow{opacity:0;transform:scaleX(.2)}
.mp .m-root{position:absolute;left:50%;top:28px;padding:13px 32px;border-radius:16px;background:var(--ink);color:#fff;font-size:24px;font-weight:720;letter-spacing:-.02em;white-space:nowrap;
  transform:translate(-50%,0);transition:transform 1.1s var(--ez);box-shadow:0 18px 40px -26px rgba(18,26,44,.7)}
.mp.intro .m-root{transform:translate(-50%,262px) scale(1.6)}
.mp .m-fam{position:absolute;top:118px;height:44px;box-sizing:border-box;border:1.5px solid var(--ink);border-radius:22px;background:#fff;display:flex;align-items:center;justify-content:center;gap:10px;
  font-size:17px;font-weight:650;opacity:0;transform:translateY(-10px);transition:opacity .5s ease .45s,transform .7s var(--ez) .45s}
.mp .m-fam span{font:500 12px var(--mono);color:var(--soft)}
.mp.fam .m-fam{opacity:1;transform:none}
.mp .m-col{position:absolute;top:210px;transition:opacity .5s}
.mp.focus .m-col:not(.act){opacity:.32}
.mp .m-hd{height:114px;box-sizing:border-box;border:1.5px solid var(--c);border-radius:14px;background:var(--ct);padding:10px 11px;display:flex;flex-direction:column;gap:4px;
  opacity:0;transform:translateY(-12px) scale(.95);transition:opacity .5s ease .3s,transform .7s var(--ez) .3s,box-shadow .5s}
.mp .m-hd .n{font:600 12px var(--mono);letter-spacing:.12em;color:var(--c)}
.mp .m-hd .t{font-size:17px;line-height:1.1;font-weight:700;letter-spacing:-.01em}
.mp .m-hd .q{font-size:13px;line-height:1.2;color:var(--soft)}
.mp .m-col.on .m-hd{opacity:1;transform:none}
.mp .m-col.act .m-hd{box-shadow:0 18px 34px -20px var(--c)}
.mp .m-ch{margin-top:8px;min-height:60px;box-sizing:border-box;border:1.5px solid var(--line);border-left:4px solid var(--c);border-radius:11px;background:#fff;padding:7px 9px;cursor:pointer;
  display:flex;flex-direction:column;justify-content:center;gap:2px;opacity:0;transform:translateX(-10px);transition:opacity .45s ease var(--d),transform .6s var(--ez) var(--d),border-color .2s,box-shadow .2s}
.mp .m-ch b{font-size:14.5px;line-height:1.1;font-weight:650}
.mp .m-ch i{font:400 11px/1.25 var(--mono);font-style:normal;color:var(--soft)}
.mp .m-col.on .m-ch{opacity:1;transform:none}
.mp .m-ch .tg{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.mp .m-ch em{font:600 9.5px var(--mono);font-style:normal;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:99px}
.mp .m-ch em.r{background:#E6ECFC;color:#2A4DD6}
.mp .m-ch em.c{background:#FCEBD9;color:#B8650C}
.mp .m-nota{margin-top:8px;font:400 11px/1.3 var(--mono);color:var(--soft);opacity:0;transition:opacity .45s ease var(--d)}
.mp .m-col.on .m-nota{opacity:1}
.mp .m-ch:hover{border-color:var(--c);border-left-color:var(--c);box-shadow:0 10px 22px -14px var(--c)}
</style>

<style>.volver{position:fixed;top:14px;right:18px;z-index:50;font:600 12px/1 "JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;padding:9px 14px;border-radius:99px;text-decoration:none;color:#565c6b;background:rgba(255,255,255,.92);border:1px solid #e4e7ef;opacity:.5;transition:opacity .2s}.volver:hover{opacity:1}@media print{.volver{display:none}}</style>

<script>
(()=>{
const NS='http://www.w3.org/2000/svg';
const stage=document.getElementById('stage');
const CS=getComputedStyle(document.documentElement);
const C={};['ink','soft','mute','line','faint','blue','amber','green','red','bg'].forEach(k=>C[k]=CS.getPropertyValue('--'+k).trim());
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches?0.05:1;

function S(tag,a={},p){const e=document.createElementNS(NS,tag);for(const k in a){const v=a[k];if(k==='style'){e.setAttribute('style',(e.getAttribute('style')||'')+';'+v)}else if(typeof v==='string'&&v.includes('var(')){e.style.setProperty(k,v)}else e.setAttribute(k,v)}if(p)p.appendChild(e);return e}
function T(p,x,y,txt,cls,anchor){const t=S('text',{x,y},p);if(cls)t.setAttribute('class',cls);if(anchor)t.setAttribute('text-anchor',anchor);
  const lines=String(txt).split('\n');if(lines.length===1)t.textContent=txt;else lines.forEach((l,i)=>{const s=S('tspan',{x,dy:i?'1.2em':'0'},t);s.textContent=l});return t}
const lin=(d0,d1,r0,r1)=>v=>r0+(v-d0)/(d1-d0)*(r1-r0);
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function gauss(r){let u=0,v=0;while(!u)u=r();while(!v)v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
const nf=(v,d=1)=>v.toLocaleString('es-CO',{minimumFractionDigits:d,maximumFractionDigits:d});
const fnum=v=>v.toLocaleString('es-CO');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
function hx(h){h=h.replace('#','');return[0,2,4].map(i=>parseInt(h.substr(i,2),16))}
function mix(a,b,t){const A=hx(a),B=hx(b);return'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')+')'}
function ramp(t,st){t=clamp(t,0,1);const n=st.length-1;const i=Math.min(n-1,Math.floor(t*n));return mix(st[i],st[i+1],t*n-i)}
const eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2, eout=t=>1-Math.pow(1-t,3);
let GEN=0;
function tween(ms,f,e=eio){const g=GEN;ms*=RM;return new Promise(res=>{const t0=performance.now();const fr=now=>{if(g!==GEN)return res(false);const t=ms<=0?1:clamp((now-t0)/ms,0,1);f(e(t),t);t<1?requestAnimationFrame(fr):res(true)};requestAnimationFrame(fr)})}
function wait(ms){const g=GEN;return new Promise(r=>setTimeout(()=>r(g===GEN),ms*RM))}
function at(el,o){for(const k in o)el.setAttribute(k,o[k])}

function axes(g,o){
  const X=lin(o.x[0],o.x[1],o.L,o.R),Y=lin(o.y[0],o.y[1],o.B,o.T);
  const a=S('g',{class:'fade','data-in':0},g);
  (o.yt||[]).forEach(v=>{S('line',{x1:o.L,x2:o.R,y1:Y(v),y2:Y(v),class:'grid'},a);T(a,o.L-12,Y(v)+4,(o.fy||fnum)(v),'tick','end')});
  (o.xt||[]).forEach(v=>{S('line',{x1:X(v),x2:X(v),y1:o.B,y2:o.B+5,class:'axis'},a);T(a,X(v),o.B+24,(o.fx||fnum)(v),'tick','middle')});
  S('line',{x1:o.L,x2:o.R,y1:o.B,y2:o.B,class:'axis'},a);
  if(o.xl)T(a,o.R,o.B+50,o.xl,'alabel','end');
  if(o.yl)T(a,o.L-12,o.T-18,o.yl,'alabel','start');
  return{X,Y,g:a};
}
function clipLine(px,py,dx,dy,L,R,Tp,B){let t0=-1e9,t1=1e9;
  const u=(p,q)=>{if(Math.abs(p)<1e-9){if(q<0){t0=1;t1=0}return}const r=q/p;if(p<0){if(r>t0)t0=r}else{if(r<t1)t1=r}};
  u(-dx,px-L);u(dx,R-px);u(-dy,py-Tp);u(dy,B-py);return t0<=t1?[px+t0*dx,py+t0*dy,px+t1*dx,py+t1*dy]:null}

let cur=0,step=0;
const D=[];

/* ───────── 0 · Esquema de apertura: todas las técnicas (tipo de aprendizaje → familia de modelo o tarea → técnica) ───────── */
D.push((()=>{let el,paths=[];
const COLS=[
  {c:'#2A4DD6',f:0,t:'Modelos lineales',q:'una ecuación con pesos',k:[['Regresión lineal','valor de una hectárea rural','R'],['Regresión logística','riesgo de deserción escolar','C']]},
  {c:'#13916A',f:0,t:'Árboles y ensambles',q:'preguntas de sí o no',k:[['Árbol de decisión','hogares para un subsidio','RC'],['Bosque aleatorio','riesgo de deforestación','RC'],['Gradient boosting','recaudo predial municipal','RC']]},
  {c:'#0E8FA8',f:0,t:'Distancia y márgenes',q:'casos parecidos',k:[['k vecinos más cercanos','vocación de una vereda','RC'],['Máquinas de soporte vectorial','urbano o rural, por satélite','RC']]},
  {c:'#7B3FD1',f:0,t:'Redes neuronales',q:'capas de neuronas',k:[['Redes neuronales','pobreza vista desde el espacio','RC'],['Deep learning','redes con muchas capas: imágenes y texto','RC','Redes neuronales']]},
  {c:'#E39A10',f:1,t:'Agrupamiento',q:'¿Qué grupos? · segmentación',k:[['K-means','tipologías de municipios']]},
  {c:'#C9367A',f:1,t:'Reducción de dimensión',q:'¿Qué lo resume?',k:[['Componentes principales','índice de vulnerabilidad']]},
  {c:'#D8432C',f:1,t:'Anomalías',q:'¿Qué es raro?',k:[['Detección de anomalías','contratos públicos atípicos']]}];
const FAM=[['Supervisado','con Y: un número → regresión · una categoría → clasificación'],['No supervisado','sin Y: grupos, resúmenes, casos raros']];
const TAG={R:'<em class="r">regresión</em>',C:'<em class="c">clasificación</em>'};
const ML=40,GAP=12,CW=(1280-2*ML-GAP*6)/7,cx=i=>ML+i*(CW+GAP)+CW/2;
const famX=f=>{const cs=COLS.map((c,i)=>i).filter(i=>COLS[i].f===f);return[ML+cs[0]*(CW+GAP),ML+cs[cs.length-1]*(CW+GAP)+CW];};
return{custom:true,steps:10,

  mk(0,d1,'Datos que representen a todos','Si la encuesta no llega a la ruralidad dispersa, el modelo tampoco la ve.');
  const nd=[[110,14],[55,70],[165,70],[25,132],[85,132],[140,132],[195,132]];const ed=[[0,1],[0,2],[1,3],[1,4],[2,5],[2,6]];
  let d2=ed.map(([a,b])=>`<line x1="${nd[a][0]}" y1="${nd[a][1]}" x2="${nd[b][0]}" y2="${nd[b][1]}" stroke="${C.mute}" stroke-width="2"/>`).join('');
  d2+=`<path d="M110 14 L55 70 L85 132" fill="none" stroke="${C.blue}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" class="draw" data-in="1" style="--d:.8s"/>`;
  d2+=nd.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i>2?9:7}" fill="${i===4?C.blue:C.bg}" stroke="${i===4?C.blue:C.ink}" stroke-width="2"/>`).join('');
  mk(1,d2,'Decisiones explicables','Un hogar debe poder saber por qué no fue priorizado por el programa.');
  const d3=`<g class="spin"><path d="M110 13 A62 62 0 0 1 172 75" fill="none" stroke="${C.ink}" stroke-width="3" stroke-linecap="round"/><path d="M164 66 L172 77 L180 66" fill="none" stroke="${C.ink}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M110 137 A62 62 0 0 1 48 75" fill="none" stroke="${C.ink}" stroke-width="3" stroke-linecap="round"/><path d="M56 84 L48 73 L40 84" fill="none" stroke="${C.ink}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><circle cx="110" cy="62" r="13" fill="${C.blue}"/><path d="M84 106 C 88 84, 132 84, 136 106 Z" fill="${C.blue}"/>`;
  mk(2,d3,'Una persona en el ciclo','La alerta sobre un contrato la revisa un analista antes de cualquier acción.');
},
fx(st,anim,el){}
}})());

/* ───────── motor ───────── */
const TOTAL=D.length;
D.forEach((d,i)=>{const el=document.createElement('section');el.className='slide';d.el=el;stage.appendChild(el);
  const pg=`<div class="pg">${String(i+1).padStart(2,'0')} <span>/ ${String(TOTAL).padStart(2,'0')}</span></div>`;
  if(d.custom){d.build(el);el.insertAdjacentHTML('beforeend',pg);return}
  el.insertAdjacentHTML('beforeend',`<div class="hd"><div class="eyebrow">${d.eyebrow}</div><h2>${d.title}</h2><p class="q">${d.q}</p></div><div class="cap"></div>${d.sim?'<div class="sim">Datos simulados con fines didácticos</div>':''}${pg}`);
  d.capEl=el.querySelector('.cap');
  let svg=null;if(!d.noSvg){svg=S('svg',{class:'viz',viewBox:'0 0 760 540'});el.appendChild(svg)}
  d.build(svg,el,svg);
});
document.querySelectorAll('.draw').forEach(p=>{try{p.style.setProperty('--len',(p.getTotalLength()+2).toFixed(1))}catch(e){}});
document.querySelectorAll('.slide').forEach(s=>s.addEventListener('animationend',()=>{}));

function applyVis(el,st){el.querySelectorAll('[data-in]').forEach(e=>{const a=+e.dataset.in,b=e.dataset.out!==undefined?+e.dataset.out:1e9;e.classList.toggle('on',st>=a);e.classList.toggle('off',st>=b)})}
function setCap(d,st,anim){const el=d.capEl;if(!el)return;const txt=d.caps[st]||'';clearTimeout(el._t);
  if(!anim){el.textContent=txt;el.classList.remove('swap');return}if(el.textContent===txt&&!el.classList.contains('swap'))return;
  el.classList.add('swap');el._t=setTimeout(()=>{el.textContent=txt;el.classList.remove('swap')},Math.max(20,260*RM))}
function apply(i,st,anim){GEN++;const d=D[i],el=d.el;
  if(!anim)el.classList.add('instant');
  if(anim&&st>0&&d.fx)d.fx(st-1,false,el);
  applyVis(el,st);if(d.fx)d.fx(st,anim,el);setCap(d,st,anim);
  if(!anim){void el.offsetWidth;el.classList.remove('instant')}}
function resetSlide(d){d.el.classList.add('instant');applyVis(d.el,-1);if(d.fx)d.fx(-1,false,d.el);if(d.capEl){d.capEl.textContent='';d.capEl.classList.add('swap')}void d.el.offsetWidth;d.el.classList.remove('instant')}
function show(n,st,dir){const old=D[cur];if(old.el!==D[n].el){old.el.classList.remove('active');old.el.classList.toggle('left',dir>0)}
  cur=n;step=st;const d=D[n];d.el.classList.add('instant');d.el.classList.toggle('left',dir<0);void d.el.offsetWidth;d.el.classList.remove('instant');
  d.el.classList.remove('left');d.el.classList.add('active');if(d.enter)d.enter();
  if(dir>=0){resetSlide(d);apply(n,st,true)}else apply(n,st,false);
  try{history.replaceState(null,'','#'+(n+1))}catch(e){}}
function next(){const d=D[cur];if(step<d.steps-1){step++;apply(cur,step,true)}else if(cur<TOTAL-1)show(cur+1,0,1)}
function prev(){if(step>0){step--;apply(cur,step,false)}else if(cur>0)show(cur-1,D[cur-1].steps-1,-1)}
addEventListener('keydown',e=>{if(['ArrowRight','ArrowDown',' ','PageDown','Enter'].includes(e.key)){e.preventDefault();next()}
  else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key)){e.preventDefault();prev()}
  else if(e.key==='Home'){show(0,0,1)}else if(e.key==='End'){show(TOTAL-1,D[TOTAL-1].steps-1,-1)}});
stage.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('.interactive'))return;next()});
function fit(){const s=Math.min((innerWidth-32)/1280,(innerHeight-32)/720);stage.style.setProperty('--s',Math.max(.1,s))}
addEventListener('resize',fit);fit();
const h=parseInt((location.hash||'').replace('#',''),10);const start=h>=1&&h<=TOTAL?h-1:0;
cur=start;D[start].el.classList.add('active');if(D[start].enter)D[start].enter();resetSlide(D[start]);requestAnimationFrame(()=>apply(start,0,true));
(function loop(now){const d=D[cur];if(d.tick)d.tick(now);requestAnimationFrame(loop)})(performance.now());
})();
</script>
