<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fundamentos de ML para investigación</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Escenario fijo 1600×900 escalado a la ventana; todo el contenido vive en SVG */
:root{
  --bg:#ffffff; --ink:#15181f; --sub:#565c6b; --muted:#9aa0ad; --line:#e8eaef;
  --st:#2f5bea; --ml:#ea7317;
  --disp:"Schibsted Grotesk","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden}
#view{position:fixed;inset:0;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;background:var(--bg)}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:50% 50%;overflow:hidden}
.slide{position:absolute;inset:0}
.slide svg{display:block;width:1600px;height:900px}
#pg{position:absolute;right:52px;bottom:34px;font:400 15px var(--mono);color:var(--muted)}
text{font-family:var(--disp)}
.kick{font:500 15px var(--mono);letter-spacing:.16em;fill:var(--muted)}
.ttl{font:600 50px var(--disp);letter-spacing:-.015em;fill:var(--ink)}
.hero{font:700 78px var(--disp);letter-spacing:-.025em;fill:var(--ink)}
.h2{font:600 30px var(--disp);letter-spacing:-.01em;fill:var(--ink)}
.h3{font:600 23px var(--disp);fill:var(--ink)}
.lab{font:500 20px var(--disp);fill:var(--ink)}
.txt{font:400 20px var(--disp);fill:var(--sub)}
.sm{font:400 16px var(--disp);fill:var(--sub)}
.tick{font:400 13px var(--mono);fill:var(--muted)}
.axl{font:500 16px var(--disp);fill:var(--sub)}
.mono{font:500 21px var(--mono);fill:var(--ink)}
.monoL{font:600 40px var(--mono);fill:var(--ink)}
.monoXL{font:600 64px var(--mono);fill:var(--ink)}
.pill{font:600 13px var(--mono);letter-spacing:.14em}
.cell{font:400 19px var(--mono);fill:var(--ink)}
.hdr{font:600 15px var(--disp);fill:var(--sub)}
.nav{font:500 15px var(--disp);fill:var(--muted)}
.nav.on{fill:var(--ink);font-weight:600}
@media (prefers-reduced-motion: reduce){#stage *{transition:none!important}}
</style>

</head>
<body>
<div id="view"><div id="stage"><div id="pg"></div></div></div>

    T=>{upd();T.to([reg,th,thT,regT],{opacity:1,duration:.5},0);fadeIn(T,mm.map(m=>m.gg),.4,{st:.15});
      mm.forEach(m=>T.from(m.b,{attr:{width:0},duration:.8,ease:'power2.out'},.8))},
    T=>{T.to(regT,{opacity:0,duration:.3},0);moveTo(T,.3,.1)},
    T=>{moveTo(T,1,.1);T.to(mm[2].gg.querySelectorAll('text'),{fill:C.bad,duration:.4},1.4);fadeIn(T,warn,1.6,{st:.1})}];
}});

/* ---------- 30 · Error en regresión ---------- */
slide({kicker:K2,title:'¿Cuánto nos equivocamos, en unidades reales?',stage:3,build(c){
  const g=G(c.svg),{xs,ys}=STUD,fit=ols(xs,ys),pr=xs.map(fit.f);
  const A=axes(g,{x:180,y:250,w:460,h:460,xd:[0,5],yd:[0,5],xt:[0,1,2,3,4,5],yt:[0,1,2,3,4,5],xl:'Nota real',yl:'Nota predicha'});
  const diag=S('line',{x1:A.sx(0),y1:A.sy(0),x2:A.sx(5),y2:A.sy(5),stroke:C.frame,'stroke-width':2,'stroke-dasharray':'8 6'},g);
  const dl=tx(g,A.sx(5)-4,A.sy(5)-12,'predicción perfecta','sm',{'text-anchor':'end'});
  const e=ys.map((y,i)=>Math.abs(pr[i]-y)),mae=mean(e),rmse=Math.sqrt(mean(e.map(v=>v*v)));
  const segs=ys.map((y,i)=>S('line',{x1:A.sx(y),x2:A.sx(y),y1:A.sy(pr[i]),y2:A.sy(y),stroke:C.ml,'stroke-width':3,'stroke-linecap':'round'},g));
  const dots=ys.map((y,i)=>S('circle',{cx:A.sx(y),cy:A.sy(pr[i]),r:7,fill:C.ink},g));
  prepDraw(segs);
  const sc=96*1.4,BX=820,BY=700,order=e.map((v,i)=>i).sort((a,b)=>e[a]-e[b]);
  const base=S('line',{x1:BX-10,x2:BX+order.length*16+6,y1:BY,y2:BY,stroke:C.frame,'stroke-width':1.5},g);
  const bl=tx(g,BX-10,BY+36,'Error de cada estudiante, ordenado','axl');
  const mline=S('line',{x1:BX-10,x2:BX+order.length*16+6,y1:BY-mae*sc,y2:BY-mae*sc,stroke:C.ink,'stroke-width':2.5},g);
  const out=[tx(g,BX-10,BY-mae*sc-260,`MAE = ${fmt(mae,2)}`,'monoL'),txl(g,BX-10,BY-mae*sc-222,['En promedio, la predicción se aleja',`${fmt(mae,2)} puntos de la nota real`],'txt',28),tx(g,BX-10,BY-mae*sc-140,`RMSE = ${fmt(rmse,2)}`,'mono',{fill:C.sub})].flat();
  const ex=exChip(g,150,856,'Predicción de la nota final (escala 0–5)');
  hide(base,bl,mline,out);
  return[T=>{T.from([A.g,diag,dl],{opacity:0,duration:.6},.1);popIn(T,dots,.3,{st:{amount:.8,from:'random'},d:.35});fadeIn(T,ex,1.2)},
    T=>{drawIn(T,segs,0,.5,{st:.03})},
    T=>{T.to([base,bl],{opacity:1,duration:.4},0);order.forEach((i,j)=>{const x=BX+j*16;T.to(segs[i],{attr:{x1:x,x2:x,y1:BY,y2:BY-e[i]*sc},duration:1,ease:'power2.inOut'},.2+j*.02);});
      T.fromTo(mline,{opacity:0,scaleX:0,transformOrigin:'0% 50%'},{opacity:1,scaleX:1,duration:.7,ease:'power2.out'},1.9);fadeIn(T,out,2.3,{st:.1})}];
}});

/* ---------- 31 · Cierre ---------- */
slide({kicker:'SÍNTESIS',title:'Dos preguntas, un mismo ciclo',build(c){
  const g=G(c.svg),cx=800,cy=500,R=190,names=['Datos','Características','Entrenamiento','Evaluación'],ang=[-135,-45,45,135];
  const ring=S('circle',{cx,cy,r:R,fill:'none',stroke:C.frame,'stroke-width':2.5},g);prepDraw(ring);
  const nodes=ang.map((a,i)=>{const rad=a*Math.PI/180,x=cx+R*Math.cos(rad),y=cy+R*Math.sin(rad),gg=G(g);S('circle',{cx:x,cy:y,r:13,fill:C.ink},gg);
    const off=[[-22,-16,'end'],[22,-16,'start'],[22,34,'start'],[-22,34,'end']][i];tx(gg,x+off[0],y+off[1],names[i],'lab',{'text-anchor':off[2]});return gg;});
  const center=txl(g,cx,cy-6,['Pregunta de','investigación'],'h2',38,{'text-anchor':'middle'});
  const orb=S('circle',{cx:cx+R*Math.cos(-.75*Math.PI),cy:cy+R*Math.sin(-.75*Math.PI),r:9,fill:C.ml},g);
  const L=[pill(g,150,470,'ESTADÍSTICA',C.st,C.stT),tx(g,150,526,'¿Por qué ocurre?','h2')],Rr=[pill(g,1450,470,'MACHINE LEARNING',C.ml,C.mlT,true),tx(g,1450,526,'¿Qué ocurrirá?','h2',{'text-anchor':'end'})];
  const a1=S('line',{x1:420,x2:cx-R-40,y1:500,y2:500,stroke:C.st,'stroke-width':2.5},g),a2=S('line',{x1:1180,x2:cx+R+40,y1:500,y2:500,stroke:C.ml,'stroke-width':2.5},g);prepDraw(a1,a2);
  const msg=tx(g,cx,810,'Pregunta primero, algoritmo después','h2',{'text-anchor':'middle'});
  hide(L,Rr,msg,orb);
  return[T=>{drawIn(T,ring,.2,1.4,{ease:'power1.inOut'});popIn(T,nodes,.5,{st:.3,s0:.4});fadeIn(T,center,1.4,{st:.1});
      T.set(orb,{opacity:1},1.8);const p={a:-135};T.to(p,{a:225,duration:2.8,ease:'power1.inOut',onUpdate:()=>{const r=p.a*Math.PI/180;orb.setAttribute('cx',cx+R*Math.cos(r));orb.setAttribute('cy',cy+R*Math.sin(r));}},1.8)},
    T=>{fadeIn(T,L,0,{st:.1,dx:-30,dy:0});fadeIn(T,Rr,.2,{st:.1,dx:30,dy:0});drawIn(T,[a1,a2],.7,.7);fadeIn(T,msg,1.4)}];
}});

/* =====================================================================
   Motor de presentación
   ===================================================================== */
const stage=document.getElementById('stage'),pg=document.getElementById('pg');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function fit(){const s=Math.min(innerWidth/1600,innerHeight/900);stage.style.transform=`translate(-50%,-50%) scale(${s})`;}
addEventListener('resize',fit);fit();
function stageNav(p,cur){const g=G(p),names=['Datos','Características','Entrenamiento','Evaluación'],xs=[1010,1100,1270,1425];
  names.forEach((n,i)=>{S('circle',{cx:xs[i],cy:91,r:5,fill:i===cur?C.ink:'none',stroke:i===cur?C.ink:C.muted,'stroke-width':1.5},g);tx(g,xs[i]+13,96,n,'nav'+(i===cur?' on':''));});return g;}
let si=0,k=0,tl=null,cur=null,steps=null;const leaving=[];
function mount(idx){const s=SLIDES[idx],root=document.createElement('div');root.className='slide';stage.insertBefore(root,pg);
  const svg=S('svg',{viewBox:'0 0 1600 900',width:1600,height:900},root);const heads=[];
  if(s.kicker)heads.push(tx(svg,96,96,s.kicker,'kick'));if(s.title)heads.push(tx(svg,96,152,s.title,'ttl'));if(s.stage!==undefined)heads.push(stageNav(svg,s.stage));
  const st=s.build({svg,root})||[];if(!st.length)st.push(()=>{});const s0=st[0];
  st[0]=T=>{if(heads.length)T.from(heads,{opacity:0,y:18,duration:.6,ease:'power3.out',stagger:.08},0);s0(T);};
  return{root,steps:st};}
function instant(fns){fns.forEach(f=>{const t=gsap.timeline();f(t);t.progress(1);t.kill();});}
function render(idx,kk,mode,dir){
  if(tl){tl.progress(1);tl.kill();tl=null;}
  while(leaving.length){const o=leaving.pop();gsap.killTweensOf(o);o.remove();}
  const old=cur,m=mount(idx);cur=m.root;steps=m.steps;si=idx;k=kk<0?steps.length-1:kk;
  if(mode==='anim'&&!reduce){tl=gsap.timeline({delay:old?.3:0});steps[0](tl);}else instant(steps.slice(0,k+1));
  if(old){if(dir&&!reduce){leaving.push(old);gsap.fromTo(cur,{x:dir*180,opacity:0},{x:0,opacity:1,duration:.7,ease:'power3.out'});
      gsap.to(old,{x:-dir*180,opacity:0,duration:.5,ease:'power2.in',onComplete:()=>{old.remove();const i=leaving.indexOf(old);if(i>=0)leaving.splice(i,1);}});}
    else old.remove();}
  pg.textContent=idx+1;}
function next(){if(tl&&tl.progress()<1){tl.progress(1);return;}
  if(k<steps.length-1){k++;tl=gsap.timeline();steps[k](tl);if(reduce)tl.progress(1);}
  else if(si<SLIDES.length-1)render(si+1,0,'anim',1);}
function prev(){if(tl&&tl.progress()<1){tl.progress(1);}
  if(k>0)render(si,k-1,'instant',0);else if(si>0)render(si-1,-1,'instant',-1);}
document.getElementById('view').addEventListener('click',next);
addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','Enter','PageDown'].includes(e.key)){e.preventDefault();next();}
  else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key)){e.preventDefault();prev();}
  else if(e.key==='Home')render(0,0,'anim',-1);
  else if(e.key==='End')render(SLIDES.length-1,-1,'instant',1);
  else if(e.key==='f'||e.key==='F'){const d=document.documentElement;if(!document.fullscreenElement)d.requestFullscreen?.().catch(()=>{});else document.exitFullscreen?.();}
});
const start=()=>render(0,0,'anim',0);
if(document.fonts&&document.fonts.ready)Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,1500))]).then(start);else start();
</script>
