<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ingeniería de características</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --ink:#121A2C; --soft:#5D6679; --mute:#A3AABA; --line:#E4E7EF; --faint:#F3F5F9;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden}
body{font-family:var(--display);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center}
.slide{position:absolute;inset:0;opacity:0;transform:translateX(80px);filter:blur(6px);transition:opacity .6s ease,transform .9s cubic-bezier(.2,.8,.2,1),filter .6s ease;pointer-events:none}
.slide.left{transform:translateX(-80px)}
.slide.active{opacity:1;transform:none;filter:none;pointer-events:auto}
#pg{position:absolute;right:64px;bottom:24px;font:500 13px var(--mono);color:var(--mute);letter-spacing:.08em}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes ring{0%{transform:scale(.9);opacity:1}100%{transform:scale(1.5);opacity:0}}

/* ---------- portada ---------- */
.cv-kick{position:absolute;left:64px;top:62px;font:600 12px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
.cv h1{position:absolute;left:62px;top:88px;margin:0;font-size:68px;line-height:.98;font-weight:750;letter-spacing:-.035em}
.cv h1 em{font-style:normal;background:linear-gradient(90deg,#D8432C,#E39A10,#6E8A0E,#13916A,#0E8FA8,#2A4DD6,#7B3FD1,#C9367A);-webkit-background-clip:text;background-clip:text;color:transparent}
.cv-sub{position:absolute;left:760px;top:120px;width:456px;margin:0;font-size:19px;line-height:1.42;color:var(--soft)}
.cv-grid{position:absolute;left:64px;right:64px;top:292px;bottom:72px;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:1fr 1fr;gap:18px}
.card{position:relative;border:1px solid var(--line);border-radius:18px;padding:20px 20px 16px;background:#fff;cursor:pointer;overflow:hidden;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s,border-color .35s;display:flex;flex-direction:column}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--c)}
.card:hover{transform:translateY(-5px);box-shadow:0 14px 34px -18px rgba(18,26,44,.35);border-color:var(--c)}
.card .n{font:600 12px var(--mono);letter-spacing:.12em;color:var(--c)}
.card h3{margin:8px 0 6px;font-size:21px;line-height:1.08;font-weight:680;letter-spacing:-.01em}
.card p{margin:0;font-size:14px;line-height:1.35;color:var(--soft)}
.card .dots{margin-top:auto;display:flex;gap:6px}
.card .dots i{width:8px;height:8px;border-radius:50%;background:var(--c);opacity:.85}
.slide.active .card{animation:rise .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*70ms + .35s)}
.slide.active .cv-kick,.slide.active .cv h1,.slide.active .cv-sub{animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
.slide.active .cv h1{animation-delay:.1s}.slide.active .cv-sub{animation-delay:.22s}
.cv-by{position:absolute;left:64px;bottom:24px;font:500 12px var(--mono);color:var(--mute);letter-spacing:.06em}

/* ---------- situación ---------- */
.sit .left{position:absolute;left:64px;top:56px;width:496px;bottom:60px;display:flex;flex-direction:column}
.slide.active .left>*{animation:rise .75s cubic-bezier(.2,.8,.2,1) both}
.slide.active .left>*:nth-child(2){animation-delay:.08s}
.slide.active .left>*:nth-child(3){animation-delay:.16s}
.slide.active .left>*:nth-child(4){animation-delay:.22s}
.slide.active .left>*:nth-child(5){animation-delay:.3s}
.kick{font:600 12px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--c);display:flex;align-items:center;gap:10px}
.kick i{width:12px;height:12px;border-radius:3px;background:var(--c)}
.sit h2{font-size:40px;line-height:1.03;font-weight:720;letter-spacing:-.025em;margin:12px 0 18px}
.pb{display:grid;grid-template-columns:88px 1fr;gap:8px;margin-bottom:9px;align-items:baseline}
.pb span{font:600 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.pb p{margin:0;font-size:16px;line-height:1.36;color:var(--soft)}
.techs{margin-top:16px;display:flex;flex-direction:column;gap:8px}
.grp{font:600 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--c);margin:4px 0 -2px}
.tc{position:relative;border:1px solid var(--line);border-radius:14px;padding:11px 16px 11px 18px;cursor:pointer;background:#fff;overflow:hidden;transition:border-color .45s,background .45s,opacity .45s,box-shadow .45s}
.tc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c);transform:scaleY(0);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.tn{font-size:17px;font-weight:650;display:flex;gap:10px;align-items:baseline}
.tn b{font:600 11.5px var(--mono);color:var(--c)}
.td{font-size:14.5px;line-height:1.4;color:var(--soft);max-height:0;opacity:0;transition:max-height .55s cubic-bezier(.2,.8,.2,1),opacity .45s,margin .45s}
.tc.on{border-color:var(--c);background:var(--ct);box-shadow:0 10px 26px -20px var(--c)}
.tc.on::before{transform:scaleY(1)}
.tc.on .td{max-height:90px;opacity:1;margin-top:5px}
.tc.off{opacity:.42}
.tc:hover{border-color:var(--c)}

.viz{position:absolute;left:600px;top:56px;width:616px;height:562px;border:1px solid var(--line);border-radius:22px;overflow:hidden;background:#fff}
.slide.active .viz{animation:fade .8s .15s both}
.cap{position:absolute;left:602px;top:632px;width:560px;font-size:15.5px;line-height:1.38;color:var(--soft)}
.cap b{color:var(--c);font-weight:650}
.cap.go{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
.sim{position:absolute;right:18px;bottom:12px;font:500 10.5px var(--mono);color:var(--mute);letter-spacing:.04em}
.vt{position:absolute;left:24px;right:24px;top:18px;height:36px;display:flex;justify-content:space-between;align-items:center;gap:12px;z-index:2}
.bd{font:500 13px var(--mono);color:var(--soft);white-space:nowrap}
.bd b{color:var(--ink);font-weight:600}
.bd .neg{color:var(--c);font-weight:600}
.fx{font:500 16px var(--mono);color:var(--ink)}
.fx sup{font-size:11px}
.chips{display:flex;gap:6px;transition:opacity .4s}
.chips.hide{opacity:0;pointer-events:none}
.chip{font:500 12.5px var(--mono);padding:6px 12px;border:1px solid var(--line);border-radius:99px;color:var(--soft);cursor:pointer;transition:all .35s;background:#fff}
.chip:hover{border-color:var(--c);color:var(--ink)}
.chip.on{background:var(--c);border-color:var(--c);color:#fff}
.vs{position:absolute;left:0;top:64px;width:616px;height:496px;overflow:visible}
.vs text{font-family:var(--mono)}
.lbl{font-size:11.5px;fill:var(--mute)}
.lbl2{font-size:12px;fill:var(--soft)}
.big{font:600 34px var(--display)!important;fill:var(--ink);transition:fill .5s}
.big.ok{fill:var(--c)}
.axl{stroke:var(--ink);stroke-width:1.2}
.gl{stroke:var(--line);stroke-width:1}

/* tablas */
.tb{position:absolute;left:28px;right:28px;top:76px}
.tr{display:grid;align-items:center;height:52px;border-bottom:1px solid var(--line);font-size:18px;position:relative;transition:height .5s cubic-bezier(.2,.8,.2,1),opacity .45s,color .4s,border-color .4s}
.tr::after{content:"";position:absolute;left:0;top:50%;height:2px;width:0;background:var(--c);transition:width .55s cubic-bezier(.2,.8,.2,1)}
.tr.strike{color:var(--mute)}
.tr.strike::after{width:100%}
.tr.drop{height:0;opacity:0;border-color:transparent;overflow:hidden}
.th{height:40px;font:600 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.th .nw{color:var(--c)}
.ix{font:500 13px var(--mono);color:var(--mute)}
.miss i{display:inline-flex;width:66px;height:32px;border:1.5px dashed var(--c);border-radius:8px;align-items:center;justify-content:center;color:var(--c);font-style:normal;animation:pulse 1.6s infinite}
.miss em{font-style:normal;font-weight:700;color:var(--c);background:var(--ct);padding:3px 10px;border-radius:8px;display:inline-block;animation:pop .55s cubic-bezier(.2,.8,.2,1) both}
.miss small{display:block;font:500 10.5px var(--mono);color:var(--c);margin-top:2px;opacity:.85;animation:fade .6s .2s both}
.pp{animation:pop .5s cubic-bezier(.2,.8,.2,1) both}
.dim{color:var(--mute)}
.tag{font:600 9.5px var(--mono);letter-spacing:.08em;border:1px solid var(--line);border-radius:6px;padding:2px 6px;margin-left:6px;color:var(--soft);vertical-align:2px}
.one{display:inline-flex;width:34px;height:30px;border-radius:8px;background:var(--c);color:#fff;font:600 16px var(--mono);align-items:center;justify-content:center}
.zero{display:inline-flex;width:34px;height:30px;border-radius:8px;background:var(--faint);color:var(--mute);font:500 16px var(--mono);align-items:center;justify-content:center}
.num{display:inline-flex;min-width:34px;height:30px;padding:0 8px;border-radius:8px;background:var(--ct);color:var(--c);font:600 16px var(--mono);align-items:center;justify-content:center}
.ft{position:absolute;left:28px;right:28px;top:392px;height:150px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px}
.ft>*{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.flow{display:flex;align-items:center;gap:14px;font:500 17px var(--mono)}
.tok{padding:8px 14px;border:1.5px solid var(--line);border-radius:10px;color:var(--ink)}
.mdl{padding:10px 18px;border-radius:12px;background:var(--ink);color:#fff}
.arr{color:var(--mute)}
.xx{color:var(--c);font-size:26px;font-weight:700}
.note{font-size:14.5px;color:var(--soft);text-align:center}
.warn{font-size:14.5px;color:var(--c);font-weight:600;text-align:center}
.maps{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.mp{font:500 14px var(--mono);padding:7px 12px;border:1px solid var(--line);border-radius:10px;color:var(--ink)}
.mp b{color:var(--c)}

/* selección */
.fl{position:absolute;left:24px;top:76px;width:404px;display:flex;flex-direction:column;gap:6px}
.fr{display:grid;grid-template-columns:148px 1fr 40px;gap:12px;align-items:center;height:47px;transition:opacity .5s}
.nm{font-size:15px;padding:9px 12px;border:1px solid var(--line);border-radius:11px;transition:all .45s;white-space:nowrap}
.fr.in .nm{border-color:var(--c);background:var(--ct);font-weight:600}
.fr.dm{opacity:.38}
.fr.out{opacity:.28}
.fr.out .nm{text-decoration:line-through}
.trk{height:10px;border-radius:99px;background:var(--faint);position:relative}
.trk .br{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--c);width:0;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.trk .th2{position:absolute;top:-10px;bottom:-10px;width:0;border-left:1.5px dashed var(--ink);opacity:0;transition:opacity .4s,left .6s}
.sv{font:500 12.5px var(--mono);color:var(--soft);opacity:0;transition:opacity .4s}
.mb{position:absolute;left:446px;top:96px;width:146px;height:330px;border:1.5px solid var(--line);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:18px 10px;box-sizing:border-box;gap:8px;transition:all .5s}
.mb.on{border-color:var(--c);box-shadow:0 18px 40px -26px var(--c)}
.mb.off{opacity:.35}
.mb .mt{font:600 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
.mb .sc{font-size:40px;font-weight:720;color:var(--c);line-height:1}
.mb .hs{font:500 11.5px var(--mono);color:var(--soft);display:flex;flex-direction:column;gap:5px;align-items:center;text-align:center}
.mb .hs div{animation:rise .45s both}
.mb .ok{color:var(--c);font-weight:600}
.thl{position:absolute;font:500 11px var(--mono);color:var(--ink);transition:opacity .4s}

/* creación */
.fxb{position:absolute;left:24px;right:24px;top:72px;height:62px;border-radius:14px;display:flex;align-items:center;justify-content:center;font:500 22px var(--mono);transition:all .6s cubic-bezier(.2,.8,.2,1)}
.fxb.q{color:var(--soft);font:500 17px var(--display);background:var(--faint)}
.fxb.f{background:var(--ct);color:var(--ink)}
.fxb .k{color:var(--c);font-weight:600}
.fxb .u{border-bottom:2px solid var(--c);padding-bottom:1px}
.tb8{top:150px}
.tb8 .tr:not(.th){height:47px}
.hl{color:var(--c)!important}
.cat{font:600 11px var(--mono);padding:3px 8px;border-radius:6px;margin-left:8px;letter-spacing:.04em}
.ex{position:absolute;left:24px;right:24px;top:440px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.exc{border:1px solid var(--line);border-radius:14px;padding:11px 12px;animation:pop .55s cubic-bezier(.2,.8,.2,1) both}
.exc .a{font:500 11.5px var(--mono);color:var(--soft);line-height:1.4}
.exc .r{font-size:15px;font-weight:650;color:var(--c);margin-top:4px}

/* guía final */
.gd h2{position:absolute;left:64px;top:52px;margin:0;font-size:40px;font-weight:720;letter-spacing:-.025em}
.gd .gk{position:absolute;left:64px;top:32px;font:600 12px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
.gd-grid{position:absolute;left:64px;right:64px;top:126px;bottom:64px;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:1fr 1fr;gap:16px}
.gd .card{padding:16px 16px 12px}
.gd .card h3{font-size:17.5px;margin:6px 0 4px}
.gd .card p{font-size:12.5px;margin-bottom:8px}
.gd ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.gd li{font-size:13.2px;line-height:1.25;padding-left:14px;position:relative}
.gd li::before{content:"";position:absolute;left:0;top:5px;width:7px;height:7px;border-radius:2px;background:var(--c)}
.gd li span{display:block;font-size:11.8px;color:var(--soft)}
</style>
</head>
<body>
<!-- regreso a «La ruta» del módulo; fuera del escenario y sin propagar el clic, para no avanzar la lámina -->
<style>.volver{position:fixed;top:14px;right:18px;z-index:50;font:600 12px/1 "JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;padding:9px 14px;border-radius:99px;text-decoration:none;color:#565c6b;background:rgba(255,255,255,.92);border:1px solid #e4e7ef;opacity:.5;transition:opacity .2s}.volver:hover{opacity:1}@media print{.volver{display:none}}</style>
<a class="volver" href="../index.html#4" onclick="event.stopPropagation()">← Módulo</a>

<div id="stage"><div id="pg"></div></div>
<script>
/* ===================== utilidades ===================== */
const NS='http://www.w3.org/2000/svg';
const stage=document.getElementById('stage'), pg=document.getElementById('pg');
function S(tag,a={},p){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;}
function H(tag,cls,html,p){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;if(p)p.appendChild(e);return e;}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function gauss(r){let u=0,v=0;while(!u)u=r();while(!v)v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
const mean=a=>a.reduce((s,x)=>s+x,0)/a.length;
const sd=a=>{const m=mean(a);return Math.sqrt(mean(a.map(x=>(x-m)**2)));};
const skew=a=>{const m=mean(a),s=sd(a);return mean(a.map(x=>((x-m)/s)**3));};
const qt=(a,p)=>{const s=[...a].sort((x,y)=>x-y),i=(s.length-1)*p,lo=Math.floor(i);return s[lo]+(s[Math.ceil(i)]-s[lo])*(i-lo);};
const ease=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
function tween(dur,fn){const t0=performance.now();let id;function f(now){const p=Math.min(1,Math.max(0,(now-t0)/dur));fn(ease(p));if(p<1)id=requestAnimationFrame(f);}id=requestAnimationFrame(f);return()=>cancelAnimationFrame(id);}
function tint(hex,a){const n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255,m=x=>Math.round(255+(x-255)*a);return`rgb(${m(r)},${m(g)},${m(b)})`;}
const pad=n=>String(n).padStart(2,'0');
function mkChips(el,items,ctx){el.innerHTML=items.map(([k,l])=>`<div class="chip" data-k="${k}">${l}</div>`).join('');
  el.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();ctx.goSub(b.dataset.k);}));
  return{el,set(k){el.querySelectorAll('.chip').forEach(b=>b.classList.toggle('on',b.dataset.k===k));}};}

/* ===================== visual 1 · faltantes ===================== */
function vMissing(){
  const cols=['Edad','Ingreso M$','Ciudad','Estrato'];
  const rows=[[34,3.2,'Bogotá',3],[28,null,'Cali',2],[null,5.8,'Medellín',4],[45,5.6,'Bogotá',4],[39,3.8,null,3],[25,2.4,'Cali',2],[51,6.0,'Bogotá',5]];
  const F={media:{'1-1':['4.5','media'],'2-0':['37','media'],'4-2':['Bogotá','moda']},
           mediana:{'1-1':['4.7','mediana'],'2-0':['36.5','mediana'],'4-2':['Bogotá','moda']},
           knn:{'1-1':['2.8','k = 2'],'2-0':['48','k = 2'],'4-2':['Bogotá','voto k = 2']}};
  const fv=(v,j)=>j===1?v.toFixed(1):v;
  let R,bd,chips,rowEls=[],T=[];
  return{
    build(root,ctx){R=root;
      root.innerHTML='<div class="vt"><div class="bd"></div><div class="chips"></div></div><div class="tb"></div>';
      bd=root.querySelector('.bd');
      chips=mkChips(root.querySelector('.chips'),[['media','Media'],['mediana','Mediana'],['knn','KNN']],ctx);
      const tb=root.querySelector('.tb'),gt='44px 1fr 1.1fr 1.2fr .8fr';
      const h=H('div','tr th','<span>#</span>'+cols.map(c=>`<span>${c}</span>`).join(''),tb);h.style.gridTemplateColumns=gt;
      rows.forEach((r,i)=>{const d=H('div','tr',`<span class="ix">${i+1}</span>`+r.map((v,j)=>v==null?`<span class="cell miss" data-k="${i}-${j}"><i>—</i></span>`:`<span>${fv(v,j)}</span>`).join(''),tb);d.style.gridTemplateColumns=gt;rowEls.push(d);});
    },
    render(st){T.forEach(clearTimeout);T=[];
      const drop=st.t===0,imp=st.t===1;
      chips.set(imp?st.sub:null);chips.el.classList.toggle('hide',!imp);
      rowEls.forEach((d,i)=>{const has=rows[i].includes(null);
        if(drop&&has){d.classList.add('strike');T.push(setTimeout(()=>d.classList.add('drop'),700));}
        else d.classList.remove('strike','drop');});
      R.querySelectorAll('.miss').forEach(c=>{const k=c.dataset.k;
        c.innerHTML=imp?`<em>${F[st.sub][k][0]}</em><small>${F[st.sub][k][1]}</small>`:'<i>—</i>';});
      bd.innerHTML=drop?'<b>4</b> de 7 registros · <span class="neg">−43 %</span>':imp?'<b>7</b> registros · <b>0</b> celdas vacías':'<b>7</b> registros · <span class="neg">3</span> celdas vacías';
    },
    leave(){T.forEach(clearTimeout);}
  };
}

/* ===================== visual 2 · categóricas ===================== */
function vCat(){
  const rows=[['Bogotá','Bachiller'],['Cali','Profesional'],['Medellín','Técnico'],['Cali','Posgrado'],['Bogotá','Profesional']];
  const city=['Bogotá','Cali','Medellín'],lvl=['Bachiller','Técnico','Profesional','Posgrado'];
  let tb,ft,bd,C;
  function table(gt,head,cells){let h=`<div class="tr th" style="grid-template-columns:${gt}"><span>#</span>${head.join('')}</div>`;

/* ===================== visual 3 · distribución ===================== */
function vDist(){
  const r=rng(7),raw=[];for(let i=0;i<500;i++)raw.push(0.4+1.3*(-Math.log(r())-Math.log(r())));
  const bcf=(a,l)=>a.map(x=>Math.abs(l)<1e-9?Math.log(x):(Math.pow(x,l)-1)/l);
  let lam=0,bs=1e9;for(let k=-20;k<=20;k++){const l=k/20,s=Math.abs(skew(bcf(raw,l)));if(s<bs){bs=s;lam=l;}}
  const D={orig:{a:raw,f:'x &nbsp;<span style="color:#A3AABA">sin transformar</span>'},sqrt:{a:raw.map(Math.sqrt),f:"x' = √x"},log:{a:raw.map(Math.log),f:"x' = log(x)"},
           bc:{a:bcf(raw,lam),f:`x' = (x<sup>λ</sup> − 1) / λ &nbsp;<span style="color:#A3AABA">λ = ${lam.toFixed(2)}</span>`}};
  const NB=22,X0=64,X1=580,BASE=392,HH=280,bw=(X1-X0)/NB,NP=60;
  for(const k in D){const a=D[k].a,mn=Math.min(...a),mx=Math.max(...a),w=(mx-mn)/NB,cnt=new Array(NB).fill(0);
    a.forEach(v=>cnt[Math.min(NB-1,Math.floor((v-mn)/w))]++);const m=mean(a),s=sd(a),cv=[];
    for(let j=0;j<=NP;j++){const x=mn+(mx-mn)*j/NP;cv.push(a.length*w*Math.exp(-(((x-m)/s)**2)/2)/(s*Math.sqrt(2*Math.PI)));}
    const top=Math.max(...cnt,...cv);Object.assign(D[k],{h:cnt.map(c=>c/top*HH),cv:cv.map(c=>c/top*HH),sk:skew(a),mn,mx});}
  let svg,bars=[],path,curH,curC,curS=0,cancel,skT,mnT,mxT,fx,chips;
  const z=()=>({h:new Array(NB).fill(0),c:new Array(NP+1).fill(0)});
  function draw(){bars.forEach((b,j)=>{b.setAttribute('y',BASE-curH[j]);b.setAttribute('height',Math.max(0,curH[j]));});
    path.setAttribute('d',curC.map((c,j)=>(j?'L':'M')+(X0+(X1-X0)*j/NP).toFixed(1)+' '+(BASE-c).toFixed(1)).join(' '));skT.textContent=curS.toFixed(2);}
  return{
    build(root,ctx){root.innerHTML='<div class="vt"><div class="bd fx"></div><div class="chips"></div></div>';
      fx=root.querySelector('.fx');chips=mkChips(root.querySelector('.chips'),[['orig','Original'],['sqrt','√x'],['log','log(x)'],['bc','Box-Cox']],ctx);
      svg=S('svg',{viewBox:'0 0 616 496',class:'vs'},root);
      S('line',{x1:X0-8,x2:X1+8,y1:BASE,y2:BASE,class:'axl'},svg);
      for(let j=0;j<NB;j++)bars.push(S('rect',{x:X0+j*bw+1.5,width:bw-3,y:BASE,height:0,rx:3,fill:ctx.c,style:'transition:fill .6s,fill-opacity .6s'},svg));
      path=S('path',{fill:'none',stroke:'#121A2C','stroke-width':2.2,'stroke-dasharray':'6 5'},svg);
      S('line',{x1:X0,x2:X0+26,y1:30,y2:30,stroke:'#121A2C','stroke-width':2.2,'stroke-dasharray':'6 5'},svg);
      S('text',{x:X0+34,y:34,class:'lbl2'},svg).textContent='curva normal de referencia';
      skT=S('text',{x:X1,y:40,'text-anchor':'end',class:'big'},svg);
      S('text',{x:X1,y:60,'text-anchor':'end',class:'lbl'},svg).textContent='asimetría · 0 = simétrica';
      mnT=S('text',{x:X0,y:BASE+24,class:'lbl'},svg);mxT=S('text',{x:X1,y:BASE+24,'text-anchor':'end',class:'lbl'},svg);
      this.xl=S('text',{x:(X0+X1)/2,y:BASE+24,'text-anchor':'middle',class:'lbl2'},svg);
      const q=z();curH=q.h;curC=q.c;draw();this.bars=bars;},
    enter(){const q=z();curH=q.h;curC=q.c;curS=0;draw();},
    render(st){const k=st.sub,T=D[k];chips.set(k);fx.innerHTML=T.f;
      const h0=curH.slice(),c0=curC.slice(),s0=curS;cancel&&cancel();
      cancel=tween(1100,e=>{curH=h0.map((v,j)=>v+(T.h[j]-v)*e);curC=c0.map((v,j)=>v+(T.cv[j]-v)*e);curS=s0+(T.sk-s0)*e;draw();});

/* ===================== visual 6 · escalamiento ===================== */
function vScale(){
  const V=[{n:'Edad',a:[22,25,29,31,34,38,41,45,50,55,62,68]},
           {n:'Ingreso',a:[1.3,1.8,2.2,2.5,3.0,3.4,3.9,4.5,5.2,6.0,7.5,38].map(v=>v*1e6)},
           {n:'Hijos',a:[0,0,1,1,1,2,2,2,3,3,4,1]}];
  const tf={raw:a=>a,z:a=>{const m=mean(a),s=sd(a);return a.map(x=>(x-m)/s);},
    mm01:a=>{const l=Math.min(...a),h=Math.max(...a);return a.map(x=>(x-l)/(h-l));},
    mm11:a=>{const l=Math.min(...a),h=Math.max(...a);return a.map(x=>2*(x-l)/(h-l)-1);},

  SL.push({el,steps:s.steps.length,
    enter(){V.enter&&V.enter();},
    render(i){const x=s.steps[i];cards.forEach((c,j)=>{c.classList.toggle('on',x.t===j);c.classList.toggle('off',x.t>=0&&x.t!==j);});
      cap.innerHTML=x.cap;cap.classList.remove('go');void cap.offsetWidth;cap.classList.add('go');V.render(x,i);},
    leave(){V.leave&&V.leave();}});
});

/* guía completa */
(function(){const el=H('section','slide gd',null,stage);
  el.innerHTML='<div class="gk">Guía completa</div><h2>Ingeniería de características</h2><div class="gd-grid"></div>';
  const g=el.querySelector('.gd-grid');
  SIT.forEach((s,k)=>{const c=H('div','card',cardHTML(s,k,true),g);setColor(c,s.c);c.style.setProperty('--i',k);c.addEventListener('click',()=>go(k+1,0));});
  SL.push({el,steps:1,render(){}});})();

/* ===================== navegación ===================== */
function go(n,s){const changed=n!==cur||!started;
  if(changed&&started&&SL[cur].leave)SL[cur].leave();
  cur=n;st=Math.max(0,Math.min(s,SL[n].steps-1));
  SL.forEach((o,i)=>{o.el.classList.toggle('active',i===n);o.el.classList.toggle('left',i<n);});
  if(changed&&SL[n].enter)SL[n].enter();
  started=true;SL[n].render(st);pg.textContent=pad(n+1)+' / '+pad(SL.length);}
function next(){if(st<SL[cur].steps-1)go(cur,st+1);else if(cur<SL.length-1)go(cur+1,0);}
function prev(){if(st>0)go(cur,st-1);else if(cur>0)go(cur-1,SL[cur-1].steps-1);}
addEventListener('keydown',e=>{const k=e.key;
  if(['ArrowRight','PageDown',' ','Enter','ArrowDown'].includes(k)){e.preventDefault();next();}
  else if(['ArrowLeft','PageUp','Backspace','ArrowUp'].includes(k)){e.preventDefault();prev();}
  else if(k==='Home'){e.preventDefault();go(0,0);}else if(k==='End'){e.preventDefault();go(SL.length-1,0);}});
function fit(){stage.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));}
addEventListener('resize',fit);fit();go(0,0);
</script>
