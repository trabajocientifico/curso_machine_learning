<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Esquema de ingeniería de características</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --ink:#121A2C; --soft:#5D6679; --mute:#A3AABA; --line:#E4E7EF; --faint:#F3F5F9;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --ez:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden}
body{font-family:var(--display);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;cursor:pointer}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center}
#pg{position:absolute;right:40px;bottom:20px;font:500 13px var(--mono);color:var(--mute);letter-spacing:.08em}

/* raíz */
#kick,#by{position:absolute;left:0;right:0;text-align:center;transition:opacity .6s,transform .9s var(--ez)}
#kick{top:236px;font:600 13px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--soft)}
#by{top:452px;font:500 13px var(--mono);color:var(--mute);letter-spacing:.06em}
#rainbow{position:absolute;left:50%;top:420px;width:300px;height:5px;margin-left:-150px;border-radius:9px;
  background:linear-gradient(90deg,#D8432C,#E39A10,#7B3FD1,#0E8FA8,#C9367A,#2A4DD6,#13916A,#6E8A0E);transition:opacity .6s,transform .9s var(--ez)}
#root{position:absolute;left:50%;top:44px;padding:17px 38px;border-radius:18px;background:var(--ink);color:#fff;
  font-size:31px;font-weight:720;letter-spacing:-.02em;white-space:nowrap;
  transform:translate(-50%,0);transition:transform 1.1s var(--ez),box-shadow .6s;box-shadow:0 18px 40px -26px rgba(18,26,44,.7)}
.intro #root{transform:translate(-50%,244px) scale(1.6)}
.intro #rainbow{transform:none}
body:not(.intro) #kick,body:not(.intro) #by{opacity:0;transform:translateY(-14px)}
body:not(.intro) #rainbow{opacity:0;transform:scaleX(.2)}
.intro #kick,.intro #by,.intro #rainbow{animation:rise .9s var(--ez) both}
.intro #by{animation-delay:.25s}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* conectores */
svg{position:absolute;overflow:visible;pointer-events:none}
.ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 1;stroke-dashoffset:1;transition:stroke-dashoffset .7s var(--ez)}
.ln.on{stroke-dashoffset:0}
#bus .ln{stroke:var(--ink);stroke-width:2.2}

/* columnas */
.col{position:absolute;top:150px;height:560px;transition:opacity .6s}
.focus .col:not(.act){opacity:.28}
.col .ln{stroke:var(--c)}
.node{margin-top:34px;height:124px;box-sizing:border-box;border:1.5px solid var(--line);border-radius:16px;background:#fff;padding:14px 10px 12px 11px;
  display:flex;flex-direction:column;gap:6px;overflow:hidden;
  opacity:0;transform:translateY(-14px) scale(.94);transition:opacity .55s,transform .7s var(--ez),background .6s,border-color .6s,box-shadow .6s}
.node .n{font:600 13px var(--mono);letter-spacing:.12em;color:var(--c);display:flex;align-items:center;gap:7px}
.node .n i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.node .t{font-size:16.5px;line-height:1.16;font-weight:690;letter-spacing:-.01em}
.col.show .node{opacity:1;transform:none;border-color:var(--c);transition-delay:.35s,.35s,0s,0s,0s}
.col.open .node{background:var(--ct)}
.col.act .node{box-shadow:0 18px 36px -22px var(--c);transform:translateY(-3px)}
.lvs{margin-top:28px}
.lf{padding:7px 0}
.chip{font-size:14.5px;line-height:1.18;font-weight:560;padding:9px 9px;border:1.5px solid var(--line);border-radius:11px;background:#fff;
  opacity:0;transform:translateX(-10px);transition:opacity .45s,transform .6s var(--ez),border-color .5s}
.chip.g{font:600 11.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--c);border-style:dashed;padding:8px 9px}
.col.open .chip{opacity:1;transform:none;border-color:var(--c);transition-delay:var(--d)}
.col.open .chip.g{border-color:var(--c)}
</style>
</head>
<body class="intro" lang="es">
<!-- regreso a «La ruta» del módulo; fuera del escenario y sin propagar el clic, para no avanzar la lámina -->
<style>.volver{position:fixed;top:14px;right:18px;z-index:50;font:600 12px/1 "JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;padding:9px 14px;border-radius:99px;text-decoration:none;color:#565c6b;background:rgba(255,255,255,.92);border:1px solid #e4e7ef;opacity:.5;transition:opacity .2s}.volver:hover{opacity:1}@media print{.volver{display:none}}</style>
<a class="volver" href="../index.html#4" onclick="event.stopPropagation()">← Módulo</a>

<div id="stage">
  <div id="kick">Machine Learning · Contenido del componente</div>
  <div id="root">Ingeniería de características</div>
  <div id="rainbow"></div>
  <div id="by">Oscar Iván Vargas Pineda · Trabajo Científico</div>
  <svg id="bus" width="1280" height="200" style="left:0;top:0"></svg>
  <div id="pg"></div>
</div>
<script>
const NS='http://www.w3.org/2000/svg';
const stage=document.getElementById('stage'),bus=document.getElementById('bus'),pg=document.getElementById('pg');
const pad=n=>String(n).padStart(2,'0');
function tint(hex,a){const n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255,m=x=>Math.round(255+(x-255)*a);return`rgb(${m(r)},${m(g)},${m(b)})`;}
function P(d,parent){const p=document.createElementNS(NS,'path');p.setAttribute('d',d);p.setAttribute('pathLength','1');p.setAttribute('class','ln');parent.appendChild(p);return p;}

/* contenido: solo nombres */
const T=[
 {c:'#D8432C',t:'Manejo de datos faltantes',k:['Descarte (eliminación)','Imputación']},
 {c:'#E39A10',t:'Codificación de variables categóricas',k:[{g:'Nominales',k:['One-Hot Encoding','Label Encoding']},{g:'Ordinales',k:['Label Encoding']}]},
 {c:'#7B3FD1',t:'Transfor\u00ADmación de distribución',k:['Ajuste a la distribución normal']},
 {c:'#0E8FA8',t:'Discreti\u00ADzación de variables numéricas',k:['Agrupación en rangos o intervalos']},
 {c:'#C9367A',t:'Manejo de valores atípicos',k:['Eliminación','Recorte (capping)','Evaluación comparativa','Preservación']},
 {c:'#2A4DD6',t:'Escalamiento de datos',k:['Estandari\u00ADzación','Min-Max','Rango intercuartil']},
 {c:'#13916A',t:'Selección de características',k:['Métodos de filtrado','Métodos wrapper','Métodos embebidos']},
 {c:'#6E8A0E',t:'Creación de características',k:['Combinación de variables']}
];

/* geometría */
const ML=24,GAP=10,N=T.length,CW=(1280-2*ML-GAP*(N-1))/N,cx=i=>ML+i*(CW+GAP)+CW/2;
const ROOT_B=114,BUS_Y=150;
const stem=P(`M640 ${ROOT_B} V${BUS_Y}`,bus);
const busL=P(`M640 ${BUS_Y} H${cx(0)}`,bus),busR=P(`M640 ${BUS_Y} H${cx(N-1)}`,bus);

const COLS=T.map((s,i)=>{
  const col=document.createElement('div');col.className='col';
  col.style.left=(ML+i*(CW+GAP))+'px';col.style.width=CW+'px';
  col.style.setProperty('--c',s.c);col.style.setProperty('--ct',tint(s.c,.1));
  const svg=document.createElementNS(NS,'svg');svg.setAttribute('width',CW);svg.setAttribute('height',560);svg.style.left=0;svg.style.top=0;col.appendChild(svg);
  const node=document.createElement('div');node.className='node';node.innerHTML=`<span class="n"><i></i>${pad(i+1)}</span><span class="t">${s.t}</span>`;col.appendChild(node);
  const lvs=document.createElement('div');lvs.className='lvs';col.appendChild(lvs);
  const items=[];
  (function add(list,parent,depth){list.forEach(it=>{
    const lf=document.createElement('div');lf.className='lf';lf.style.marginLeft=(18*depth)+'px';
    const ch=document.createElement('div');ch.className='chip'+(it.g?' g':'');ch.textContent=it.g||it;lf.appendChild(ch);lvs.appendChild(lf);
    items.push({ch,parent});if(it.g)add(it.k,ch,depth+1);});})(s.k,node,1);
  stage.appendChild(col);
  return{col,svg,node,items,drop:null,paths:[]};
});

/* conectores internos: se calculan con la maqueta real (offsets no se ven afectados por transformaciones) */
function wire(){COLS.forEach(C=>{C.svg.innerHTML='';
  C.drop=P(`M${CW/2} 0 V34`,C.svg);
  C.paths=C.items.map((it,k)=>{const p=it.parent,ch=it.ch;
    const ax=p.offsetLeft+9,ay=p.offsetTop+p.offsetHeight,cy=ch.offsetTop+ch.offsetHeight/2,x1=ch.offsetLeft;
    const path=P(`M${ax} ${ay} V${cy-6} Q${ax} ${cy} ${ax+6} ${cy} H${x1}`,C.svg);
    path.style.transitionDelay=(k*140)+'ms';ch.style.setProperty('--d',(k*140+260)+'ms');return path;});});}

/* pasos: 0 raíz · 1–8 situaciones · 9–16 técnicas · 17 vista completa */
const STEPS=2+2*N;let st=0;
function render(){
  document.body.classList.toggle('intro',st===0);
  const lineOn=(p,on,delay)=>{p.style.transitionDelay=on?(delay||0)+'ms':'0ms';p.classList.toggle('on',on);};
  lineOn(stem,st>=1,900);lineOn(busL,st>=1,1150);lineOn(busR,st>=1,1150);
  const focus=st>N&&st<=2*N;stage.classList.toggle('focus',focus);
  COLS.forEach((C,i)=>{
    const shown=st>=i+1,open=st>=N+1+i,act=focus&&st===N+1+i;
    C.col.classList.toggle('show',shown);C.col.classList.toggle('open',open);C.col.classList.toggle('act',act);
    C.drop.style.transitionDelay=shown?(st===1?'1500ms':'0ms'):'0ms';C.drop.classList.toggle('on',shown);
    C.node.style.transitionDelay=shown&&st===1?'1.7s':'';
    C.paths.forEach((p,k)=>{p.style.transitionDelay=open?(k*140)+'ms':'0ms';p.classList.toggle('on',open);});
  });
  pg.textContent=pad(st+1)+' / '+pad(STEPS);
}
function go(n){st=Math.max(0,Math.min(STEPS-1,n));render();}
addEventListener('keydown',e=>{const k=e.key;
  if(['ArrowRight','PageDown',' ','Enter','ArrowDown'].includes(k)){e.preventDefault();go(st+1);}
  else if(['ArrowLeft','PageUp','Backspace','ArrowUp'].includes(k)){e.preventDefault();go(st-1);}
  else if(k==='Home'){e.preventDefault();go(0);}else if(k==='End'){e.preventDefault();go(STEPS-1);}});
addEventListener('click',()=>go(st+1));
addEventListener('contextmenu',e=>{e.preventDefault();go(st-1);});
function fit(){stage.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));}
addEventListener('resize',fit);fit();
wire();render();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{wire();render();});
</script>
</body>
</html>
