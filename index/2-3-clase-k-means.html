<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K-means</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Plantilla de la skill presentacion-clase · escenario fijo 1600×900 escalado a la ventana; todo el contenido vive en SVG.
   El primer <script> es GSAP minificado: no editarlo. El código de la clase está en el segundo. */
:root{
  --bg:#ffffff; --ink:#15181f; --sub:#565c6b; --muted:#9aa0ad; --line:#e8eaef;
  --st:#2f5bea; --ml:#ea7317;
  --disp:"Schibsted Grotesk","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden}
#view{position:fixed;inset:0;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;background:var(--bg)}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:50% 50%;overflow:hidden}
.slide{position:absolute;inset:0}
.slide svg{display:block;width:1600px;height:900px}
#pg{position:absolute;right:52px;bottom:34px;font:400 15px var(--mono);color:var(--muted)}
text{font-family:var(--disp)}
.kick{font:500 15px var(--mono);letter-spacing:.16em;fill:var(--muted)}
.ttl{font:600 50px var(--disp);letter-spacing:-.015em;fill:var(--ink)}
.hero{font:700 78px var(--disp);letter-spacing:-.025em;fill:var(--ink)}
.h2{font:600 30px var(--disp);letter-spacing:-.01em;fill:var(--ink)}
.h3{font:600 23px var(--disp);fill:var(--ink)}
.lab{font:500 20px var(--disp);fill:var(--ink)}
.txt{font:400 20px var(--disp);fill:var(--sub)}
.sm{font:400 16px var(--disp);fill:var(--sub)}
.tick{font:400 13px var(--mono);fill:var(--muted)}
.axl{font:500 16px var(--disp);fill:var(--sub)}
.mono{font:500 21px var(--mono);fill:var(--ink)}
.monoL{font:600 40px var(--mono);fill:var(--ink)}
.monoXL{font:600 64px var(--mono);fill:var(--ink)}
.pill{font:600 13px var(--mono);letter-spacing:.14em}
.cell{font:400 19px var(--mono);fill:var(--ink)}
.hdr{font:600 15px var(--disp);fill:var(--sub)}
.nav{font:500 15px var(--disp);fill:var(--muted)}
.nav.on{fill:var(--ink);font-weight:600}
/* índice de láminas: vive fuera del escenario para que sus clics no avancen la presentación */
#ixBtn{position:fixed;top:16px;right:20px;z-index:20;border:1px solid var(--line);background:rgba(255,255,255,.9);color:var(--sub);
  font:600 12px var(--mono);letter-spacing:.1em;padding:9px 14px;border-radius:99px;cursor:pointer;opacity:.55;transition:opacity .2s,background .2s,color .2s}
#ixBtn:hover{opacity:1;background:var(--ink);color:#fff;border-color:var(--ink)}
#ixOv{position:fixed;inset:0;z-index:30;background:rgba(21,24,31,.3);opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
#ixOv.open{opacity:1;visibility:visible}
#ixPanel{position:absolute;top:0;right:0;height:100%;width:min(430px,92vw);box-sizing:border-box;background:#fff;border-left:1px solid var(--line);
  padding:22px 20px 28px;overflow-y:auto;transform:translateX(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1);font-family:var(--disp);color:var(--ink)}
#ixOv.open #ixPanel{transform:none}
.ix-h{display:flex;justify-content:space-between;align-items:center;font:600 11px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--st)}
#ixX{border:none;background:#f5f6f8;width:34px;height:34px;border-radius:50%;cursor:pointer;color:var(--ink);font-size:14px}
#ixX:hover{background:var(--ml);color:#fff}
.ix-back{display:inline-block;margin-top:14px;font:500 13px var(--disp);color:var(--sub);text-decoration:none}
.ix-back:hover{color:var(--st)}
.ix-g{font:500 10.5px var(--mono);letter-spacing:.16em;color:var(--muted);margin:18px 0 6px}
#ixBody ul{list-style:none;margin:0;padding:0}
#ixBody li{display:flex;align-items:baseline;gap:12px;padding:8px 10px;border-radius:10px;cursor:pointer;font:500 15px/1.25 var(--disp)}
#ixBody li span{font:600 11px var(--mono);color:var(--ml);flex:none}
#ixBody li:hover{background:#f5f6f8}
#ixBody li.cur{background:var(--st);color:#fff}
#ixBody li.cur span{color:#fff;opacity:.75}
@media (prefers-reduced-motion: reduce){#stage *{transition:none!important}#ixOv,#ixPanel{transition:none}}
</style>

</head>
<body>
<div id="view"><div id="stage"><div id="pg"></div></div></div>
<button id="ixBtn" aria-label="Índice de láminas">☰ Índice</button>
<div id="ixOv"><div id="ixPanel">
  <div class="ix-h"><span>Ir a una lámina</span><button id="ixX" aria-label="Cerrar">✕</button></div>
  <a class="ix-back" id="ixBack" href="../index.html#4">← Volver al módulo</a>
  <div id="ixBody"></div>
</div></div>

const MATHF="'STIX Two Text','Cambria Math','Times New Roman',serif";
function formula(p,x,y,tex,o={}){const size=o.size||30,g=G(p),tmp=G(g);

    const grupo=()=>{if(s[i]==='{'){let d=1,j=i+1;while(j<s.length&&d){if(s[j]==='{')d++;else if(s[j]==='}')d--;j++;}const r=s.slice(i+1,j-1);i=j;return r;}return s[i++];};

      else if(s.startsWith('\\sum',i)){flush();i+=4;let lo=[],hi=[];while(s[i]==='_'||s[i]==='^'){const k=s[i++],v=parse(grupo());if(k==='_')lo=v;else hi=v;}out.push({t:'sum',lo,hi});}

  else{cen=[X[Math.floor(r()*n)].slice()];const dm=X.map(x=>d2(x,cen[0]));
    while(cen.length<k){const tot=dm.reduce((s,v)=>s+v,0);let u=r()*tot,i=0;while(i<n-1&&(u-=dm[i])>0)i++;
      cen.push(X[i].slice());X.forEach((x,j)=>{dm[j]=Math.min(dm[j],d2(x,cen[cen.length-1]));});}}
  let lab=new Array(n).fill(-1);const hist=[{cen:cen.map(c=>c.slice()),lab:null}];
  for(let it=0;it<maxIt;it++){let cambios=0;
    const nl=X.map((x,i)=>{let b=0,bd=Infinity;cen.forEach((c,j)=>{const v=d2(x,c);if(v<bd){bd=v;b=j;}});if(b!==lab[i])cambios++;return b;});
    lab=nl;if(!cambios)break;
    cen=cen.map((c,j)=>{const m=X.filter((_,i)=>lab[i]===j);return m.length?Array.from({length:dim},(_,q)=>mean(m.map(x=>x[q]))):c;});
    hist.push({cen:cen.map(c=>c.slice()),lab:lab.slice(),cambios});}
  return{lab,cen,k,hist,iner:inercia(X,lab,cen)};}
const inercia=(X,lab,cen)=>X.reduce((s,x,i)=>s+d2(x,cen[lab[i]]),0);
/* varios inicios: se queda con el de menor inercia (lo que hace n_init en scikit-learn) */
function kmeans(X,k,seed=42,nInit=10){let mejor=null;for(let s=0;s<nInit;s++){const m=kmeans1(X,k,seed*100+s);if(!mejor||m.iner<mejor.iner-1e-9)mejor=m;}return mejor;}

/* ---------- silueta: s = (b − a) / max(a, b) para cada punto; se promedia ---------- */
function siluetas(X,lab,k){const n=X.length,cnt=Array(k).fill(0);lab.forEach(l=>cnt[l]++);
  return X.map((x,i)=>{const s=Array(k).fill(0);for(let j=0;j<n;j++)if(j!==i)s[lab[j]]+=Math.sqrt(d2(x,X[j]));
    const li=lab[i];if(cnt[li]<2)return{a:0,b:0,s:0};const a=s[li]/(cnt[li]-1);let b=Infinity,bj=-1;
    for(let q=0;q<k;q++)if(q!==li&&cnt[q]&&s[q]/cnt[q]<b){b=s[q]/cnt[q];bj=q;}return{a,b,bj,s:(b-a)/Math.max(a,b)};});}
const silueta=(X,lab,k)=>mean(siluetas(X,lab,k).map(v=>v.s));

/* ---------- índice de Rand ajustado (ARI): 1 = mismos grupos, 0 = lo que daría el azar ---------- */
function ari(a,b){const n=a.length,ka=Math.max(...a)+1,kb=Math.max(...b)+1,T=Array.from({length:ka},()=>Array(kb).fill(0));
  a.forEach((v,i)=>T[v][b[i]]++);const c2=v=>v*(v-1)/2;let sij=0;T.forEach(f=>f.forEach(v=>sij+=c2(v)));
  const sa=T.reduce((s,f)=>s+c2(f.reduce((x,y)=>x+y,0)),0),sb=Array.from({length:kb},(_,j)=>T.reduce((s,f)=>s+f[j],0)).reduce((s,v)=>s+c2(v),0);
  const esp=sa*sb/c2(n),mx=(sa+sb)/2;return(sij-esp)/(mx-esp);}

/* las dos variables del ejemplo hilo, escaladas: Z2 */
const E2=escalar([MUNI.map(d=>d.l),MUNI.map(d=>d.a)]),Z2=E2.Z;
const aPct=c=>[c[0]*E2.sd[0]+E2.mu[0],c[1]*E2.sd[1]+E2.mu[1]];        // centroide escalado → porcentajes
const KG=3;                                                            // el k de la clase (la parte 4 muestra por qué)
const GN=['Menos privaciones','Rezago educativo','Rezago y sin agua'];   // nombres de los tres grupos, de menos a más privación
/* reordena los grupos de menos a más privación (promedio de val en cada grupo): así los colores tienen sentido */
function orden(m,val){const k=m.k,prom=Array.from({length:k},(_,j)=>{const v=val.filter((_,i)=>m.lab[i]===j);return v.length?mean(v):Infinity;});
  const o=prom.map((v,j)=>[v,j]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]),inv=[];o.forEach((j,q)=>inv[j]=q);
  const re=l=>l?l.map(v=>inv[v]):l;
  return{...m,lab:re(m.lab),cen:o.map(j=>m.cen[j]),hist:m.hist.map(h=>({...h,cen:o.map(j=>h.cen[j]),lab:re(h.lab)}))};}
const VAL2=MUNI.map(d=>d.l+d.a);
const KM=k=>memo('km'+k,()=>orden(kmeans(Z2,k),VAL2));
const M3=()=>KM(KG);
/* colores de los grupos: de azul (menos privación) a naranja (más), pasando por morado */
const ANCLAS=['#2f5bea','#8a4fd1','#ea7317'];
function mezcla(a,b,t){const h=s=>[1,3,5].map(i=>parseInt(s.slice(i,i+2),16)),A=h(a),B=h(b);return'#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('');}
function colK(j,k){if(k<2)return C.st;const t=j/(k-1)*(ANCLAS.length-1),i=Math.min(Math.floor(t),ANCLAS.length-2);return mezcla(ANCLAS[i],ANCLAS[i+1],t-i);}
const busca=n=>MUNI.find(d=>d.m===n);
const nm=v=>Math.round(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.');   // miles con punto, como se escribe en Colombia
const TABLA=['Bogotá, D.C.','Medellín','Pasto','Riohacha','Leticia','Quibdó','Uribia'].map(busca);

/* siluetas de k = 2…8: cuestan cerca de un segundo en total; se calculan en segundo plano desde la lámina 8 */
const SIL={},KS=[2,3,4,5,6,7,8];
const unaSil=k=>{if(!SIL[k])SIL[k]=siluetas(Z2,KM(k).lab,k);return SIL[k];};
/* cálculos de más de medio segundo: se hacen en segundo plano, cada uno desde unas láminas antes de usarlo
   (si la clase llega antes, la lámina lo calcula al construirse) */
const COLA=[[2,()=>INICIOS()],[5,()=>UNID()],...KS.map(k=>[7,()=>unaSil(k)]),[12,()=>ESTAB()],[12,()=>M15F()]];
setTimeout(function seguir(){if(!COLA.length)return;if(typeof si==='undefined'||si<COLA[0][0])return setTimeout(seguir,1000);
  COLA.shift()[1]();setTimeout(seguir,300);},1500);
const silMedia=k=>mean(unaSil(k).map(v=>v.s));

/* ---------- dibujo: el plano bajo logro educativo × sin agua mejorada (en %) ---------- */
function plano(g,o={}){const b=Object.assign({L:150,R:930,T:262,B:730},o),xd=o.xd||[10,100],yd=o.yd||[0,100];
  const sx=lin(xd[0],xd[1],b.L,b.R),sy=lin(yd[0],yd[1],b.B,b.T),gA=G(g);
  S('line',{x1:b.L,x2:b.R,y1:b.B,y2:b.B,stroke:C.frame,'stroke-width':1.5},gA);S('line',{x1:b.L,x2:b.L,y1:b.T,y2:b.B,stroke:C.frame,'stroke-width':1.5},gA);
  (o.xt||[20,40,60,80,100]).forEach(v=>tx(gA,sx(v),b.B+26,v+' %','tick',{'text-anchor':'middle'}));
  (o.yt||[0,25,50,75,100]).forEach(v=>tx(gA,b.L-14,sy(v)+5,v+' %','tick',{'text-anchor':'end'}));
  if(!o.sinEtq){tx(gA,b.R,b.B+56,o.xl||'Bajo logro educativo (% de personas)','axl',{'text-anchor':'end'});tx(gA,b.L,b.T-20,o.yl||'Sin acceso a agua mejorada (% de personas)','axl');}
  return{g:gA,b,sx,sy,x:d=>sx(d.l),y:d=>sy(d.a)};}
const puntosM=(g,P,D,r=4.5,fill=C.dot)=>{const gg=G(g);return D.map((d,i)=>S('circle',{cx:P.x(d),cy:P.y(d),r,fill:typeof fill==='function'?fill(d,i):fill,stroke:C.w,'stroke-width':r>5?1.5:.8},gg));};
/* centroide: círculo de color con una cruz blanca; se ubica con gsap (x, y) */
function centro(p,col,r=13){const gg=G(p);S('circle',{r:r+5,fill:C.w,opacity:.9},gg);S('circle',{r,fill:col,stroke:C.ink,'stroke-width':3},gg);
  S('path',{d:`M${-r*.5},0 h${r} M0,${-r*.5} v${r}`,stroke:C.w,'stroke-width':3,'stroke-linecap':'round'},gg);return gg;}
/* nube de muchos puntos: solo opacidad (popIn mide cada punto para escalarlo y con miles se congela) */
const nube=(T,els,at,am)=>T.fromTo(els,{opacity:0},{opacity:1,duration:.3,stagger:{amount:am,from:'random'}},at);
/* estrella: el municipio que se sigue */
function estrella(p,x,y,r=16){const pts=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r;pts.push([x+rr*Math.cos(a),y+rr*Math.sin(a)]);}
  return S('path',{d:pathD(pts)+'Z',fill:C.ink,stroke:C.w,'stroke-width':2},p);}

function boton_nb(c,txt){const a=document.createElement('a');a.href=NB;a.target='_blank';a.rel='noopener';a.textContent=txt||'Práctica: notebook 2-3 con 1.122 municipios →';

/* proporción de casos que coinciden entre dos agrupaciones de k grupos, con la mejor correspondencia de nombres */
function coincide(a,b,k){const perms=p=>p.length<2?[p]:p.flatMap((v,i)=>perms([...p.slice(0,i),...p.slice(i+1)]).map(r=>[v,...r]));

}});

/* =====================================================================
   Motor de presentación
   ===================================================================== */
const stage=document.getElementById('stage'),pg=document.getElementById('pg');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function fit(){const s=Math.min(innerWidth/1600,innerHeight/900);stage.style.transform=`translate(-50%,-50%) scale(${s})`;}
addEventListener('resize',fit);fit();
/* etapas del ciclo; las posiciones salen del largo de cada nombre, alineadas a la derecha */
const ETAPAS=['Pregunta','Datos','Características','Entrenamiento','Evaluación','Comunicar'];
function stageNav(p,cur){const g=G(p),w=ETAPAS.map(n=>n.length*8.2+13),gap=22;let x=1504-w.reduce((a,b)=>a+b)-gap*(ETAPAS.length-1);
  ETAPAS.forEach((n,i)=>{S('circle',{cx:x,cy:91,r:5,fill:i===cur?C.ink:'none',stroke:i===cur?C.ink:C.muted,'stroke-width':1.5},g);tx(g,x+13,96,n,'nav'+(i===cur?' on':''));x+=w[i]+gap;});return g;}
let si=0,k=0,tl=null,cur=null,steps=null;const leaving=[];
function mount(idx){const s=SLIDES[idx],root=document.createElement('div');root.className='slide';stage.insertBefore(root,pg);
  const svg=S('svg',{viewBox:'0 0 1600 900',width:1600,height:900},root);const heads=[];
  if(s.kicker)heads.push(tx(svg,96,96,s.kicker,'kick'));if(s.title)heads.push(tx(svg,96,152,s.title,'ttl'));if(s.stage!==undefined)heads.push(stageNav(svg,s.stage));
  const st=s.build({svg,root})||[];if(!st.length)st.push(()=>{});const s0=st[0];
  st[0]=T=>{if(heads.length)T.from(heads,{opacity:0,y:18,duration:.6,ease:'power3.out',stagger:.08},0);s0(T);};
  return{root,steps:st};}
function instant(fns){fns.forEach(f=>{const t=gsap.timeline();f(t);t.progress(1);t.kill();});}
function render(idx,kk,mode,dir){
  if(tl){tl.progress(1);tl.kill();tl=null;}
  while(leaving.length){const o=leaving.pop();gsap.killTweensOf(o);o.remove();}
  const old=cur,m=mount(idx);cur=m.root;steps=m.steps;si=idx;k=kk<0?steps.length-1:kk;
  if(mode==='anim'&&!reduce){tl=gsap.timeline({delay:old?.3:0});steps[0](tl);}else instant(steps.slice(0,k+1));
  if(old){if(dir&&!reduce){leaving.push(old);gsap.fromTo(cur,{x:dir*180,opacity:0},{x:0,opacity:1,duration:.7,ease:'power3.out'});
      gsap.to(old,{x:-dir*180,opacity:0,duration:.5,ease:'power2.in',onComplete:()=>{old.remove();const i=leaving.indexOf(old);if(i>=0)leaving.splice(i,1);}});}
    else old.remove();}
  pg.textContent=idx+1;}
function next(){if(tl&&tl.progress()<1){tl.progress(1);return;}
  if(k<steps.length-1){k++;tl=gsap.timeline();steps[k](tl);if(reduce)tl.progress(1);}
  else if(si<SLIDES.length-1)render(si+1,0,'anim',1);}
function prev(){if(tl&&tl.progress()<1){tl.progress(1);}
  if(k>0)render(si,k-1,'instant',0);else if(si>0)render(si-1,-1,'instant',-1);}
document.getElementById('view').addEventListener('click',next);
addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('input,textarea,select'))return;
  if(['ArrowRight','ArrowDown',' ','Enter','PageDown'].includes(e.key)){e.preventDefault();next();}
  else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key)){e.preventDefault();prev();}
  else if(e.key==='Home')render(0,0,'anim',-1);
  else if(e.key==='End')render(SLIDES.length-1,-1,'instant',1);
  else if(e.key==='f'||e.key==='F'){const d=document.documentElement;if(!document.fullscreenElement)d.requestFullscreen?.().catch(()=>{});else document.exitFullscreen?.();}
});
/* ---------- índice: una entrada por lámina, agrupadas por su rótulo ---------- */
(function(){
  const btn=document.getElementById('ixBtn'),ov=document.getElementById('ixOv'),body=document.getElementById('ixBody');
  let html='',last=null;
  SLIDES.forEach((s,i)=>{const b=s.kicker||'INICIO';if(b!==last){if(last!==null)html+='</ul>';html+=`<div class="ix-g">${b}</div><ul>`;last=b;}
    html+=`<li data-i="${i}"><span>${String(i+1).padStart(2,'0')}</span>${s.title||'Portada'}</li>`;});
  body.innerHTML=html+'</ul>';
  const items=[...body.querySelectorAll('li')];
  const open=o=>{ov.classList.toggle('open',o);if(!o)return;items.forEach(li=>li.classList.toggle('cur',+li.dataset.i===si));
    const c=body.querySelector('.cur');if(c)c.scrollIntoView({block:'center'});};
  items.forEach(li=>li.onclick=()=>{const i=+li.dataset.i;open(false);if(i!==si)render(i,0,'anim',i>si?1:-1);});
  btn.onclick=()=>open(true);document.getElementById('ixX').onclick=()=>open(false);ov.onclick=e=>{if(e.target===ov)open(false);};
  /* en captura: con el índice abierto las teclas no mueven la presentación */
  addEventListener('keydown',e=>{const on=ov.classList.contains('open');
    if(!on&&e.target.closest&&e.target.closest('input,textarea,select'))return;
    if((e.key==='i'||e.key==='I')&&!e.ctrlKey&&!e.metaKey&&!e.altKey){open(!on);e.stopImmediatePropagation();}
    else if(on){if(e.key==='Escape')open(false);e.stopImmediatePropagation();}},true);
})();
{const vb=document.getElementById('ixBack');if(VOLVER)vb.href=VOLVER;else vb.remove();}
/* #n en la URL abre la lámina n (1 = portada) ya armada: sirve para revisar y para scripts/capturar.ps1 */
const start=()=>{const m=/^#(\d+)$/.exec(location.hash);if(m&&+m[1]>=1&&+m[1]<=SLIDES.length)render(+m[1]-1,-1,'instant',0);else render(0,0,'anim',0);};
/* se espera a las fuentes (formula() mide el texto con STIX Two Text) */
if(document.fonts&&document.fonts.ready)Promise.race([Promise.all([document.fonts.ready,document.fonts.load("30px 'STIX Two Text'"),document.fonts.load("italic 30px 'STIX Two Text'")]),new Promise(r=>setTimeout(r,2500))]).then(start);else start();
</script>
